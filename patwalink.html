<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PatwaLink</title>
<style>
:root{
  /* Paleta de cartel pintado a mano: rótulos de tienda y flyers de
     sound system. Cálida y luminosa, sin recurrir al tricolor. */
  --paper:#FFF3DC;        /* papel crema */
  --paper-2:#FFE9C2;      /* sombra de papel */
  --ink:#161C1A;          /* tinta, casi negra con verde */
  --sun:#FFC12E;          /* amarillo rótulo */
  --sun-d:#E8A200;
  --tomato:#FF5436;       /* rojo tomate */
  --sea:#00A99A;          /* turquesa */
  --sea-d:#00786F;
  --grape:#6C4BD8;        /* morado dancehall */
  --leaf:#3FA34D;         /* verde monte */
  --muted:#6E6A5C;

  --isle-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20214%2090%27%3E%3Cpath%20d%3D%27M2.9%2024%20L11.4%2016%20L21.9%2011%20L45.6%209%20L71.3%206%20L90.3%209%20L114.1%2013%20L123.6%2015%20L137.9%2016%20L143.6%2019%20L155%2029%20L165.5%2033%20L185.4%2038%20L200.6%2051%20L211.1%2064%20L189.2%2068%20L174%2069%20L154.1%2059%20L148.4%2063%20L140.7%2068%20L123.6%2069%20L119.8%2086%20L104.6%2069%20L80.8%2070%20L50.4%2071%20L47.6%2054%20L35.2%2040%20L25.7%2035%20L2.85%2030%20Z%27%20fill%3D%27black%27%2F%3E%3C%2Fsvg%3E");
  --display:'Arial Black','Archivo Black','Helvetica Neue',Impact,sans-serif;
  --body:'Roboto','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'Roboto Mono','DejaVu Sans Mono',monospace;

  --dur:.16s;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;line-height:1.5;
  padding:0 0 70px;
  overflow-x:hidden;
  /* trama de puntos: papel de impresión */
  background-image:radial-gradient(var(--paper-2) 1.1px, transparent 1.2px);
  background-size:13px 13px;
}
[hidden]{display:none!important}

/* ============================================================
   CABECERA
   ============================================================ */
.masthead{
  position:relative;
  border-bottom:3px solid var(--ink);
  background:var(--sea);
  padding:0;
  overflow:hidden;
}
.masthead::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:9px;
  background:repeating-linear-gradient(90deg,
    var(--sun) 0 22px, var(--tomato) 22px 44px, var(--grape) 44px 66px);
}
.seachart{padding:14px 14px 0;position:relative}
.seachart svg{display:block;width:100%;height:auto;max-height:150px}
.ring{fill:none;stroke:rgba(22,28,26,.16);stroke-width:.8;opacity:var(--o)}
.isle-fill{fill:var(--sun)}
.isle{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.pin{fill:var(--tomato);stroke:var(--ink);stroke-width:.8}
.pinlabel{fill:var(--ink);font-family:var(--mono);font-size:5.2px;letter-spacing:.5px;opacity:.75}

.mast-copy{padding:2px 18px 22px;position:relative}
.wordmark{
  font-family:var(--display);
  font-size:clamp(40px,14vw,66px);
  letter-spacing:-.03em;
  text-transform:uppercase;
  line-height:.84;
  margin:0;
  color:var(--paper);
  /* desajuste de registro tipo serigrafía */
  text-shadow:
     3px 3px 0 var(--ink),
     6px 6px 0 var(--tomato);
}
.wordmark span{color:var(--sun)}
.thesis{
  margin:14px 0 0;max-width:32ch;
  color:var(--ink);font-size:14px;font-weight:500;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:12px;
  padding:9px 12px;
  box-shadow:3px 3px 0 var(--ink);
  transform:rotate(-.7deg);
}
.thesis b{font-weight:800}

/* ============================================================
   CONTROLES
   ============================================================ */
.tpane{padding:22px 18px 0}
.dirbar{display:flex;gap:10px;margin-bottom:14px;align-items:stretch}
.autobtn{
  flex:0 0 auto;padding:0 15px;
  background:linear-gradient(180deg,#FFFFFF 0%, var(--paper) 100%);
  border:2.5px solid var(--ink);border-radius:14px;
  color:var(--muted);
  font-family:var(--display);font-size:12px;letter-spacing:.06em;
  cursor:pointer;position:relative;overflow:hidden;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform var(--dur), box-shadow var(--dur);
}
.autobtn::before{
  content:'';position:absolute;left:0;right:0;top:0;height:48%;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));
  border-radius:inherit;pointer-events:none;
}
.autobtn.on{
  background:linear-gradient(180deg,#5FE0D3 0%, var(--sea) 55%, #007A70 100%);
  color:#fff;
}
.autobtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.dirbtn.auto .lado{color:var(--muted)}
.detectado{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;
  background:linear-gradient(180deg,#5FE0D3 0%, var(--sea) 100%);
  color:#fff;border:2px solid var(--ink);
  padding:3px 9px;border-radius:20px;
  position:absolute;right:14px;top:-13px;
  box-shadow:2px 2px 0 var(--ink);z-index:5;
  white-space:nowrap;
}
.detectado.duda{background:linear-gradient(180deg,#FFDA6E 0%, var(--sun) 100%);color:var(--ink)}
.dirbtn{
  flex:1;display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden;
  background:var(--paper);
  border:2.5px solid var(--ink);
  border-radius:14px;
  color:var(--ink);
  font-family:var(--display);
  font-size:13px;letter-spacing:.04em;text-transform:uppercase;
  cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform var(--dur), box-shadow var(--dur);
}
.dirbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.dirbtn .lado{flex:1;display:flex;align-items:center;justify-content:center;padding:13px 8px}
.dirbtn .arrow{
  display:flex;align-items:center;justify-content:center;
  width:52px;flex:0 0 auto;color:var(--ink);
  background:var(--sun);
  border-left:2.5px solid var(--ink);
  border-right:2.5px solid var(--ink);
}
.dirbtn:focus-visible{outline:3px solid var(--grape);outline-offset:3px}

#src{
  width:100%;min-height:118px;resize:vertical;
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:14px;
  color:var(--ink);
  font-family:var(--body);
  font-size:17.5px;line-height:1.45;
  padding:14px 15px;outline:none;
  box-shadow:4px 4px 0 var(--ink);
}
#src:focus{box-shadow:4px 4px 0 var(--sea)}
#src::placeholder{color:#A9A296}

.gobar{display:flex;align-items:center;gap:13px;margin-top:15px}
.go{
  display:flex;align-items:center;gap:9px;
  background:var(--sun);
  border:2.5px solid var(--ink);
  border-radius:14px;
  color:var(--ink);
  font-family:var(--display);
  font-size:19px;text-transform:uppercase;letter-spacing:.03em;
  padding:13px 26px;cursor:pointer;
  box-shadow:5px 5px 0 var(--ink);
  transition:transform var(--dur), box-shadow var(--dur), background var(--dur);
}
.go:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink);background:var(--sun-d)}
.go[disabled]{background:#DDD6C6;color:var(--muted);box-shadow:2px 2px 0 var(--muted);cursor:default}
.go:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.ctxnote{font-family:var(--mono);font-size:10px;color:var(--muted)}
.tout{padding:22px 18px 0}

/* ============================================================
   RESULTADO
   ============================================================ */
.seg{
  position:relative;
  margin-top:20px;
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:16px;
  padding:0;margin-bottom:20px;
  box-shadow:5px 5px 0 var(--ink);
}
.seg-src{border-radius:13px 13px 0 0}
.seg:nth-child(odd){transform:rotate(-.5deg)}
.seg:nth-child(even){transform:rotate(.45deg)}
.seg::before{content:none}
.seg::after{
  content:'';position:absolute;right:0;top:0;
  width:130px;height:56px;background:var(--sea);opacity:.09;
  border-radius:0 13px 0 0;
  -webkit-mask:var(--isle-mask) right top/contain no-repeat;
          mask:var(--isle-mask) right top/contain no-repeat;
  pointer-events:none;
}
.seg-src{
  font-size:13px;color:var(--muted);font-weight:500;
  padding:11px 16px;
  background:var(--paper-2);
  border-bottom:2.5px solid var(--ink);
  position:relative;
}
.seg-out{padding:18px 16px 8px;position:relative}
.seg-out .rmain{
  font-family:var(--display);
  font-size:28px;line-height:1.2;
  letter-spacing:-.015em;
  margin:0;color:var(--ink);
}
.seg-foot{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px 10px;position:relative;
}
.act{
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:9px;
  color:var(--ink);
  font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;
  padding:7px 11px;cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);
  transition:transform var(--dur), box-shadow var(--dur), background var(--dur);
}
.act:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.act.on{background:var(--sea);color:#fff}
.act .ic{margin-right:6px;vertical-align:-1px}
.spacer{flex:1}

.alerta{
  display:flex;gap:9px;align-items:flex-start;
  margin:0 16px 14px;padding:11px 13px;
  background:#FFEDE9;
  border:2px solid var(--ink);
  border-left:7px solid var(--tomato);
  border-radius:10px;
  font-size:13.5px;position:relative;
}
.alerta b{color:var(--tomato);font-weight:800}
.sug{
  display:inline-block;font-size:12.5px;color:var(--ink);font-weight:600;
  background:var(--sun);
  border:2px solid var(--ink);
  padding:3px 9px;border-radius:20px;margin:6px 4px 0 0;cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);
}
.sug b{color:var(--ink)}
.sug:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

/* diagnóstico plegable */
.diag{display:none;padding:2px 16px 16px;position:relative;
  border-top:2px dashed var(--ink);margin-top:4px}
.diag.on{display:block}
.diag-t{font-family:var(--mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:13px 0 8px;font-weight:700}
.diag-r{display:flex;gap:9px;font-size:12.5px;margin-bottom:6px;align-items:baseline}
.diag-r .c{font-family:var(--mono);font-size:9.5px;color:#fff;background:var(--leaf);
  padding:2px 5px;border-radius:5px;flex:0 0 auto;min-width:36px;text-align:center;font-weight:700}
.diag-m{display:flex;align-items:center;gap:9px;margin-top:11px}
.diag-m .bar{flex:1;height:8px;background:var(--paper-2);border:2px solid var(--ink);
  border-radius:6px;overflow:hidden}
.diag-m .bar i{display:block;height:100%;background:var(--sea)}
.diag-m span{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}

/* palabras consultables */
.w{cursor:pointer;border-bottom:2.5px solid var(--sea);padding-bottom:1px}
.w:active{background:var(--sun)}
.w.nolex{border-bottom:none;cursor:default}
.w.infer{border-bottom:2.5px dotted var(--tomato);color:var(--tomato)}
.unk{color:var(--tomato);border-bottom:2.5px dotted var(--tomato)}

.pista{
  display:flex;gap:10px;align-items:center;
  font-size:13px;color:var(--muted);font-weight:500;
  margin:0 4px 18px;
}
.pista svg{flex:0 0 auto;width:36px;height:16px;color:var(--sea)}

.vacio{
  text-align:center;color:var(--muted);font-size:14px;
  padding:22px 20px 10px;line-height:1.6;font-weight:500;
}
.vacio .glyph{display:block;width:108px;height:46px;margin:0 auto 16px;color:var(--sea)}

.foot{
  display:flex;align-items:flex-start;gap:10px;
  padding:26px 18px 0;color:var(--muted);
  font-size:11.5px;font-family:var(--mono);line-height:1.7;
}
.foot .glyph{color:var(--sea);flex:0 0 auto;margin-top:3px;width:2.6em;height:1.1em}
.glyph{display:inline-block;vertical-align:-2px;height:1em;width:2.4em}
.glyph path{fill:currentColor}

/* ============================================================
   HOJA DE DETALLE
   ============================================================ */
.sheet-bg{position:fixed;inset:0;background:rgba(22,28,26,.55);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  visibility:hidden;
  background:var(--paper);
  border-top:4px solid var(--ink);
  border-radius:22px 22px 0 0;
  max-height:82vh;overflow-y:auto;
  transform:translateY(102%);
  transition:transform .26s cubic-bezier(.2,.9,.3,1), visibility .26s;
  padding:0 18px 34px;
}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet-grab{width:52px;height:5px;border-radius:3px;background:var(--ink);
  opacity:.25;margin:12px auto 16px}
.sh-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.sh-word{font-family:var(--display);font-size:33px;text-transform:lowercase;
  line-height:1;margin:0;letter-spacing:-.02em}
.sh-pos{color:var(--muted);font-size:12.5px;font-style:italic;font-weight:600}
.sh-tag{
  margin-left:auto;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  background:var(--grape);color:#fff;
  border:2px solid var(--ink);padding:3px 8px;border-radius:20px;
}
.sh-tag.gram{background:var(--sea)}
.sh-etym{font-family:var(--mono);font-size:12px;color:var(--muted);margin:8px 0 0}
.sh-quick{font-size:22px;font-weight:800;margin:15px 0 0;
  padding-top:13px;border-top:2px dashed var(--ink)}
.sh-none{color:var(--muted);font-size:14px;padding:14px 0 0;
  border-top:2px dashed var(--ink);margin-top:12px}

/* fichas del glosario dentro de la hoja */
.variants{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:11px 0 0;
  border-top:2px dashed var(--ink)}
.variants .vlabel{width:100%;font-family:var(--mono);font-size:9px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin-bottom:3px;font-weight:700}
.chip{font-family:var(--mono);font-size:12px;background:#fff;
  border:2px solid var(--ink);color:var(--ink);padding:3px 9px;border-radius:20px}
.chip.hit{background:var(--sun)}
.sense{margin-top:18px;padding-top:15px;border-top:2px solid var(--ink)}
.sense:first-of-type{border-top:none}
.senseno{font-family:var(--mono);font-size:11px;color:#fff;background:var(--ink);
  display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;
  border-radius:50%;font-weight:700}
.gloss{font-size:20px;font-weight:800;margin:6px 0 2px}
.gloss-en{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 11px}
.reg{display:inline-block;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:3px 9px;border-radius:20px;margin-bottom:10px;
  background:#fff;color:var(--ink);border:2px solid var(--ink)}
.reg[data-r="vulgar"]{background:var(--tomato);color:#fff}
.reg[data-r="rasta"]{background:var(--leaf);color:#fff}
.reg[data-r="dancehall"]{background:var(--grape);color:#fff}
.note{font-size:14.5px;margin:0 0 10px}
.note .k,.warn .k,.tone .k,.revnote .k{display:block;font-family:var(--mono);
  font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px;font-weight:700}
.warn{border:2px solid var(--ink);border-left:7px solid var(--tomato);
  background:#FFEDE9;padding:11px 13px;margin:12px 0;font-size:14px;border-radius:10px}
.warn .k{color:var(--tomato)}
.tone{border:2px solid var(--ink);border-left:7px solid var(--sea);
  background:#E4FAF7;padding:11px 13px;margin:12px 0;font-size:14px;border-radius:10px}
.tone .k{color:var(--sea-d)}
.ex{font-family:var(--mono);font-size:13px;padding:11px 13px;margin-top:12px;
  background:var(--paper-2);border:2px solid var(--ink);border-radius:10px}
.ex .p{color:var(--ink);font-weight:700}
.ex .t{color:var(--muted);display:block;margin-top:3px}
.keys{display:flex;margin-top:16px;border:2px solid var(--ink);border-radius:10px;
  overflow:hidden;font-family:var(--mono);font-size:11px;background:#fff}
.keys div{flex:1;padding:8px 11px;min-width:0}
.keys div+div{border-left:2px solid var(--ink)}
.keys .lbl{display:block;color:var(--muted);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;margin-bottom:2px;font-weight:700}
.keys .val{display:block;color:var(--sea-d);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* la isla como indicador de carga */
.spin{
  display:inline-block;width:54px;height:23px;background:var(--ink);
  -webkit-mask:var(--isle-mask) center/contain no-repeat;
          mask:var(--isle-mask) center/contain no-repeat;
  position:relative;overflow:hidden;
}
.spin::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--sun),transparent);
  animation:sweep 1.1s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}


/* ============================================================
   ACABADO 2000s
   Plástico translúcido, brillo especular y cromados. Se monta
   encima del cartel serigrafiado, sin sustituirlo: el contorno
   negro sigue mandando y el brillo sólo lo remata.
   ============================================================ */

/* --- brillo especular reutilizable --- */
.go, .dirbtn, .act, .sug, .chip, .reg, .sh-tag, .diag-r .c{
  position:relative;
  overflow:hidden;
  isolation:isolate;
}
.go::before, .dirbtn::before, .act::before, .sug::before,
.chip::before, .reg::before, .sh-tag::before{
  content:'';
  position:absolute;
  left:0;right:0;top:0;height:48%;
  background:linear-gradient(180deg,
    rgba(255,255,255,.62) 0%,
    rgba(255,255,255,.24) 60%,
    rgba(255,255,255,0) 100%);
  border-radius:inherit;
  pointer-events:none;
  z-index:1;
}
.go > *, .dirbtn > *, .act > *, .sug > *{position:relative;z-index:2}

/* --- botón principal: plástico caramelo --- */
.go{
  background:linear-gradient(180deg, #FFD968 0%, var(--sun) 46%, #F0A800 100%);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
.go:active{
  background:linear-gradient(180deg, #E8A200 0%, #FFC12E 100%);
}
.dirbtn .arrow{
  background:linear-gradient(180deg, #FFD968 0%, var(--sun) 55%, #F0A800 100%);
}
.dirbtn{background:linear-gradient(180deg,#FFFFFF 0%, var(--paper) 100%)}

/* --- cabecera: agua con reflejo --- */
.masthead{
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(180deg, #17C4B4 0%, var(--sea) 55%, #008B7F 100%);
}
/* franja inferior con acabado cromado */
.masthead::after{
  background:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 55%,
                    rgba(0,0,0,.22) 100%),
    repeating-linear-gradient(90deg,
      var(--sun) 0 22px, var(--tomato) 22px 44px, var(--grape) 44px 66px);
  height:11px;
}

/* --- logotipo cromado --- */
.wordmark{
  background:linear-gradient(180deg,
    #FFFFFF 0%, #FFFFFF 38%, #E7DCC0 52%, #FFFFFF 66%, #F3E7CB 100%);
  -webkit-background-clip:text;
          background-clip:text;
  color:transparent;
  -webkit-text-stroke:0;
  filter:drop-shadow(3px 3px 0 var(--ink)) drop-shadow(6px 6px 0 var(--tomato));
  text-shadow:none;
}
.wordmark span{
  background:linear-gradient(180deg, #FFE9A8 0%, var(--sun) 45%, #E08A00 100%);
  -webkit-background-clip:text;
          background-clip:text;
  color:transparent;
}

/* --- isla con volumen --- */
.isle-fill{filter:url(#brilloIsla)}

/* --- tarjetas: plástico con reflejo superior --- */
.seg{
  background:linear-gradient(180deg,#FFFFFF 0%, #FFFDF7 62%, #FFF6E6 100%);
}
.seg-out::before{

<script>
/* ============================================================
   Normalización — espejo exacto de patwa_normalize()
   y patwa_phonetic_key() en PostgreSQL. Si cambias una, cambia
   la otra o la búsqueda del cliente y la del servidor divergen.
   ============================================================ */
/* `normalize` y `phoneticKey` son funciones puras de una cadena, y salen
   juntas en el 74% del perfil de CPU: derivar una palabra desconocida las
   llama cientos de veces sobre el mismo puñado de formas. Memorizarlas es
   el cambio de mayor efecto por línea escrita en todo el motor.
   La caché se vacía entera al llegar al tope en vez de desalojar entrada
   por entrada: el vocabulario de una sesión no se acerca a esa cifra, así
   que en la práctica no se vacía nunca y la memoria queda acotada igual. */
const MEMO_TOPE = 20000;
const _memoNorm = new Map();
const _memoFon  = new Map();

function normalize(txt){
  const k = txt || '';
  const v = _memoNorm.get(k);
  if(v !== undefined) return v;
  const r = k
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/['`´’\-.,!?¡¿"()]/g,'')
    .replace(/\s+/g,'');
  if(_memoNorm.size >= MEMO_TOPE) _memoNorm.clear();
  _memoNorm.set(k, r);
  return r;
}

function phoneticKey(txt){
  const k = txt || '';
  const v = _memoFon.get(k);
  if(v !== undefined) return v;
  const r = _phoneticKey(k);
  if(_memoFon.size >= MEMO_TOPE) _memoFon.clear();
  _memoFon.set(k, r);
  return r;
}

function _phoneticKey(txt){
  let s = normalize(txt);
  s = s.replace(/th/g,'d');
  s = s.replace(/^h/,'');
  s = s.replace(/aa/g,'a').replace(/ee/g,'e').replace(/oo/g,'u');
  s = s.replace(/ou/g,'u').replace(/ow/g,'u');
  s = s.replace(/eh/g,'e').replace(/ah/g,'a');
  s = s.replace(/wh/g,'w');
  s = s.replace(/(.)\1/g,'$1');
  s = s.replace(/er$/,'a');
  return s;
}

/* similitud por bigramas — sustituto de pg_trgm en cliente */
function bigrams(s){
  const out=[]; for(let i=0;i<s.length-1;i++) out.push(s.slice(i,i+2));
  return out;
}
function similarity(a,b){
  if(!a||!b) return 0;
  const A=bigrams(a), B=bigrams(b);
  if(!A.length||!B.length) return a===b?1:0;
  const pool=B.slice(); let hits=0;
  A.forEach(g=>{const i=pool.indexOf(g); if(i>-1){pool.splice(i,1);hits++;}});
  return (2*hits)/(A.length+B.length);
}

/* índice precalculado */
GLOSSARY.forEach(e=>{
  e.normKey = normalize(e.headword);
  e.phonKey = phoneticKey(e.headword);
  e.variantKeys = (e.variants||[]).map(v=>({spelling:v, key:normalize(v), phon:phoneticKey(v)}));
});

/* búsqueda en cascada: exacta → variante → fonética → difusa */
function search(q){
  const nk = normalize(q), pk = phoneticKey(q);
  if(!nk) return [];
  const rank = {exact:0, variant:1, phonetic:2, fuzzy:3};
  const hits = [];

  GLOSSARY.forEach(e=>{
    let type = null, sim = 0, hitVariant = null;

    if(e.normKey === nk) type='exact';
    else {
      const v = e.variantKeys.find(v=>v.key===nk);
      if(v){ type='variant'; hitVariant=v.spelling; }
      else if(e.phonKey === pk) type='phonetic';
      else {
        const vp = e.variantKeys.find(v=>v.phon===pk);
        if(vp){ type='phonetic'; hitVariant=vp.spelling; }
        else{
          sim = Math.max(
            similarity(e.normKey,nk),
            ...e.variantKeys.map(v=>similarity(v.key,nk)),
            ...e.senses.map(s=>similarity(normalize(s.es),nk))
          );
          if(sim >= .42) type='fuzzy';
        }
      }
    }
    if(type) hits.push({e, type, sim, hitVariant});
  });

  return hits.sort((a,b)=> rank[a.type]-rank[b.type] || b.sim-a.sim).slice(0,8);
}

/* devuelve la detección aplicada, o null si no se tocó nada */
function aplicarDeteccion(texto){

  if(!d.idioma || !d.fiable) return d;
  const nuevaDir = d.idioma === 'pw' ? 'pw2es' : 'es2pw';
  if(nuevaDir !== dir){ dir = nuevaDir; paintDir(); }
  return d;
}

/* entradas del glosario relacionadas con el texto */
function ngrams(text, maxN){
  const words = text.trim().split(/\s+/).filter(Boolean);
  const out = [];
  for(let n=1; n<=maxN; n++)
    for(let i=0; i+n<=words.length; i++) out.push(words.slice(i,i+n).join(' '));
  return out;
}

function contextFor(text){
  const grams = ngrams(text, 3);
  const gramKeys = grams.map(g=>({n:normalize(g), p:phoneticKey(g)}));
  const scored = [];
  GLOSSARY.forEach(e=>{
    let best = 0;
    if(dir === 'pw2es'){
      gramKeys.forEach(g=>{
        if(!g.n) return;
        if(e.normKey === g.n || e.variantKeys.some(v=>v.key === g.n)) best = Math.max(best, 1);
        else if(e.phonKey === g.p || e.variantKeys.some(v=>v.phon === g.p)) best = Math.max(best, .9);
        else best = Math.max(best, similarity(e.normKey, g.n) * .8);
      });
    } else {
      const full = normalize(text);
      e.senses.forEach(s=>{
        const gk = normalize(s.es);
        if(full.includes(gk) && gk.length > 3) best = Math.max(best, 1);
        gramKeys.forEach(g=>{ if(g.n.length > 2) best = Math.max(best, similarity(gk, g.n)); });
      });
    }
    if(best >= .55) scored.push({e, score:best});
  });
  return scored.sort((a,b)=>b.score-a.score).slice(0,6).map(x=>x.e);
}

function contextBlock(entries){
  return entries.map(e=>{
    const senses = e.senses.map(s=>
      `  - ${s.es} [${s.register}]` + (s.note ? ` | uso: ${s.note}` : '')
      + (s.warn ? ` | AVISO: ${s.warn}` : '') + (s.tone ? ` | tono: ${s.tone}` : '')
    ).join('\n');
    return `${e.headword} (grafías: ${e.variants.join(', ')})\n${senses}`;
  }).join('\n\n');
}
