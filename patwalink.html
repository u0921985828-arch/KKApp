  dar:{pres:['doy','das','da','damos','dais','dan'],pret:['di','diste','dio','dimos','disteis','dieron']},
  decir:{pres:['digo','dices','dice','decimos','decís','dicen'],pret:['dije','dijiste','dijo','dijimos','dijisteis','dijeron'],ger:'diciendo'},
  venir:{pres:['vengo','vienes','viene','venimos','venís','vienen'],pret:['vine','viniste','vino','vinimos','vinisteis','vinieron'],ger:'viniendo'},
  poner:{pres:['pongo','pones','pone','ponemos','ponéis','ponen'],pret:['puse','pusiste','puso','pusimos','pusisteis','pusieron']},
  salir:{pres:['salgo','sales','sale','salimos','salís','salen'],pret:['salí','saliste','salió','salimos','salisteis','salieron']},
  oír:{pres:['oigo','oyes','oye','oímos','oís','oyen'],pret:['oí','oíste','oyó','oímos','oísteis','oyeron'],ger:'oyendo'},
  dormir:{pres:['duermo','duermes','duerme','dormimos','dormís','duermen'],pret:['dormí','dormiste','durmió','dormimos','dormisteis','durmieron'],ger:'durmiendo'},
  jugar:{pres:['juego','juegas','juega','jugamos','jugáis','juegan'],pret:['jugué','jugaste','jugó','jugamos','jugasteis','jugaron']},
  pensar:{pres:['pienso','piensas','piensa','pensamos','pensáis','piensan'],pret:['pensé','pensaste','pensó','pensamos','pensasteis','pensaron']},
  sentir:{pres:['siento','sientes','siente','sentimos','sentís','sienten'],pret:['sentí','sentiste','sintió','sentimos','sentisteis','sintieron'],ger:'sintiendo'},
  empezar:{pres:['empiezo','empiezas','empieza','empezamos','empezáis','empiezan'],pret:['empecé','empezaste','empezó','empezamos','empezasteis','empezaron']},
  cerrar:{pres:['cierro','cierras','cierra','cerramos','cerráis','cierran'],pret:['cerré','cerraste','cerró','cerramos','cerrasteis','cerraron']},
  entender:{pres:['entiendo','entiendes','entiende','entendemos','entendéis','entienden'],pret:['entendí','entendiste','entendió','entendimos','entendisteis','entendieron']},
  encontrar:{pres:['encuentro','encuentras','encuentra','encontramos','encontráis','encuentran'],pret:['encontré','encontraste','encontró','encontramos','encontrasteis','encontraron']},
  costar:{pres:['cuesto','cuestas','cuesta','costamos','costáis','cuestan'],pret:['costé','costaste','costó','costamos','costasteis','costaron']},
  morir:{pres:['muero','mueres','muere','morimos','morís','mueren'],pret:['morí','moriste','murió','morimos','moristeis','murieron'],ger:'muriendo'},
  perder:{pres:['pierdo','pierdes','pierde','perdemos','perdéis','pierden'],pret:['perdí','perdiste','perdió','perdimos','perdisteis','perdieron']},
  leer:{pres:['leo','lees','lee','leemos','leéis','leen'],pret:['leí','leíste','leyó','leímos','leísteis','leyeron'],ger:'leyendo'},
  conducir:{pres:['conduzco','conduces','conduce','conducimos','conducís','conducen'],pret:['conduje','condujiste','condujo','condujimos','condujisteis','condujeron']},
  seguir:{pres:['sigo','sigues','sigue','seguimos','seguís','siguen'],pret:['seguí','seguiste','siguió','seguimos','seguisteis','siguieron'],ger:'siguiendo'},
  reír:{pres:['río','ríes','ríe','reímos','reís','ríen'],pret:['reí','reíste','rió','reímos','reísteis','rieron'],ger:'riendo'}
};

const END = {
  ar:{pres:['o','as','a','amos','áis','an'],pret:['é','aste','ó','amos','asteis','aron'],imp:['aba','abas','aba','ábamos','abais','aban']},
  er:{pres:['o','es','e','emos','éis','en'],pret:['í','iste','ió','imos','isteis','ieron'],imp:['ía','ías','ía','íamos','íais','ían']},
  ir:{pres:['o','es','e','imos','ís','en'],pret:['í','iste','ió','imos','isteis','ieron'],imp:['ía','ías','ía','íamos','íais','ían']}
};

function conjugate(lemma, person, tense){
  const refl = lemma.endsWith('se');
  const base = refl ? lemma.slice(0,-2) : lemma;
  const ir = IRREG[base];
  let form;
  if(ir && ir[tense]) form = ir[tense][person];
  else {
    const grp = base.slice(-2);
    const stem = base.slice(0,-2);
    const set = END[grp] || END.er;
    form = stem + (set[tense] || set.pres)[person];
  }
  if(refl){
    const clit = ['me','te','se','nos','os','se'][person];
    return clit + ' ' + form;
  }
  return form;
}

function gerund(lemma){
  const base = lemma.endsWith('se') ? lemma.slice(0,-2) : lemma;
  if(IRREG[base] && IRREG[base].ger) return IRREG[base].ger;
  const grp = base.slice(-2), stem = base.slice(0,-2);
  return stem + (grp === 'ar' ? 'ando' : 'iendo');
}

const PART_IRREG = {hacer:'hecho', decir:'dicho', ver:'visto', poner:'puesto',
 volver:'vuelto', abrir:'abierto', escribir:'escrito', morir:'muerto',
 romper:'roto', cubrir:'cubierto', resolver:'resuelto', freír:'frito',
 imprimir:'impreso', descubrir:'descubierto', devolver:'devuelto',
 describir:'descrito', destruir:'destruido'};

function participio(lemma){
  const base = lemma.endsWith('se') ? lemma.slice(0,-2) : lemma;
  if(PART_IRREG[base]) return PART_IRREG[base];
  const grp = base.slice(-2), stem = base.slice(0,-2);
  if(grp === 'ar') return stem + 'ado';
  if(/[aeiou]$/.test(stem)) return stem + 'ído';
  return stem + 'ido';
}

/* ---------- R2: clase aspectual ----------
   En criollo el verbo desnudo es PASADO si es dinámico y PRESENTE
   si es estativo. Sin este rasgo el tiempo verbal es incorrecto en
   la mayoría de oraciones reales.                                  */
const ESTATIVOS = new Set(['saber','conocer','tener','poseer','querer','amar',
 'gustar','necesitar','deber','creer','entender','comprender','recordar',
 'sentir','parecer','pertenecer','costar','valer','existir','vivir',
 'odiar','preferir','temer','importar','doler','faltar','merecer','esperanzar',
 'confiar','sospechar','dudar','depender','significar']);

const esEstativo = lemma => ESTATIVOS.has(lemma);

/* ---------- R2b: incoativas ----------
   El criollo expresa el cambio de estado con verbo ligero + adjetivo:
   `get cold`, `tun big`. El español no: o lo lexicaliza en un verbo
   pronominal (enfriarse) o lo perifrasea con «ponerse». Traducido
   pieza por pieza sale «está consiguiendo fría», que no es español.

   La tabla va indexada por el adjetivo ESPAÑOL, no por el token
   criollo: así cubre todas las grafías que resuelvan al mismo lema.
   Lo que no esté en ella cae en la perífrasis, que siempre funciona. */
const INCOATIVOS = {
  'frío':'enfriarse',        'caliente':'calentarse',
  'oscuro':'oscurecerse',    'mojado':'mojarse',
  'seco':'secarse',          'sucio':'ensuciarse',
  'limpio':'limpiarse',      'lleno':'llenarse',
  'vacío':'vaciarse',        'enfermo':'enfermarse',
  'cansado':'cansarse',      'gordo':'engordar',
  'flaco':'adelgazar',       'viejo':'envejecer',
  'grande':'crecer',         'pequeño':'encogerse',
  'listo':'prepararse',      'dormido':'dormirse',
  'muerto':'morirse',        'loco':'enloquecer',
  'contento':'alegrarse',
  'rico':'enriquecerse',     'pobre':'empobrecerse',
  'fuerte':'fortalecerse',   'débil':'debilitarse',
  'triste':'entristecerse',  'perdido':'perderse',
  'duro':'endurecerse',      'blando':'ablandarse',
  'bravo':'enfadarse',       'borracho':'emborracharse'
};

/* verbos ligeros que forman la incoativa */
const V_INCOAT = ['get','ge','tun','ton','turn'];

/* Devuelve el cambio de estado que empieza en `j`, o null si allí no hay
   una incoativa. `fem`/`pl` sólo hacen falta para la perífrasis, donde el
   adjetivo sigue concordando: «se puso nerviosa». `len` es cuántos tokens
   consume la construcción, que son tres si el adjetivo va reduplicado.   */
function analizarIncoativa(toks, j, fem, pl){
  if(!toks[j] || !V_INCOAT.includes(normalize(toks[j]))) return null;
  const adjTok = toks[j+1];
  if(!adjTok) return null;

  const h   = lookupPw(adjTok);
  const adj = h && h.find(x=>x.type === 'adj');
  if(!adj) return null;

  /* reduplicación sobre un cambio de estado: intensifica el proceso,
     no el resultado, así que pide «cada vez más», no un superlativo */
  const red = toks[j+2] && normalize(toks[j+2]) === normalize(adjTok);

  /* `get` seguido de adjetivo + nombre es «conseguir», no incoativa:
     en «get nice ting» el adjetivo va con el nombre, no con el verbo. */
  if(!red && toks[j+2] && tipoDe(toks[j+2], adjTok) === 'noun') return null;

  const len = red ? 3 : 2;
  const lex = INCOATIVOS[adj.d.es];
  if(lex) return {lemma: lex, len, cola: red ? 'cada vez más' : '',
                  etiqueta:'INC verbo ligero + adjetivo → incoativo léxico'};

  const a = agree(adj.d.es, fem, pl, adj.d.inv);
  return {lemma:'ponerse', len, cola: (red ? 'cada vez más ' : '') + a,
          etiqueta:'INC verbo ligero + adjetivo → perífrasis con ponerse'};
}

function agree(adjLemma, fem, plural, inv){
  let a = adjLemma;
  if(!inv){
    if(fem && a.endsWith('o')) a = a.slice(0,-1) + 'a';
  }
  if(plural) a += /[aeiouáéíóú]$/.test(a) ? 's' : 'es';
  return a;
}

const PL_IRREG = {joven:'jóvenes', imagen:'imágenes', examen:'exámenes',
  origen:'orígenes', crimen:'crímenes', 'régimen':'regímenes'};
function pluralize(noun){
  if(PL_IRREG[noun]) return PL_IRREG[noun];
  if(/[aeiouáéíóú]$/.test(noun)) return noun + 's';
  if(noun.endsWith('z')) return noun.slice(0,-1) + 'ces';
  if(noun.endsWith('ón')) return noun.slice(0,-2) + 'ones';
  if(noun.endsWith('ús')) return noun.slice(0,-2) + 'uses';
  return noun + 'es';
}

/* imperfecto de subjuntivo: se forma sobre la 3ª plural del pretérito */
function subjImperfecto(lemma, p){
  const base = lemma.endsWith('se') ? lemma.slice(0,-2) : lemma;
  const p3 = conjugate(base, 5, 'pret').replace(/ron$/,'');
  return p3 + ['ra','ras','ra','ramos','rais','ran'][p];
}


/* ---------- subjuntivo presente ----------
   Se forma sobre la 1ª persona del presente de indicativo, lo que
   arrastra automáticamente las irregularidades (vengo → venga).  */
function subjuntivo(lemma, p){
  const base = lemma.endsWith('se') ? lemma.slice(0,-2) : lemma;
  const irr = {ser:['sea','seas','sea','seamos','seáis','sean'],
    estar:['esté','estés','esté','estemos','estéis','estén'],
    ir:['vaya','vayas','vaya','vayamos','vayáis','vayan'],
    haber:['haya','hayas','haya','hayamos','hayáis','hayan'],
    saber:['sepa','sepas','sepa','sepamos','sepáis','sepan'],
    dar:['dé','des','dé','demos','deis','den']};
  if(irr[base]) return irr[base][p];
  const p1 = conjugate(base, 0, 'pres');
  const raiz = p1.replace(/o$/,'');
  const grp = base.slice(-2);
  const term = grp === 'ar' ? ['e','es','e','emos','éis','en']
                            : ['a','as','a','amos','áis','an'];
  return orth ? orth(raiz, term[p]) + term[p] : raiz + term[p];
}

/* ---------- imperativo ---------- */
const IMP_IRREG = {venir:'ven', tener:'ten', poner:'pon', salir:'sal', hacer:'haz',
  decir:'di', ser:'sé', ir:'ve', dar:'da', estar:'está'};

function imperativo(lemma, plural, negativo){
  const base = lemma.endsWith('se') ? lemma.slice(0,-2) : lemma;
  if(negativo) return 'no ' + subjuntivo(base, plural ? 4 : 1);
  if(plural){                       /* vosotros: infinitivo con -d */
    return base.slice(0,-1) + 'd';
  }
  if(IMP_IRREG[base]) return IMP_IRREG[base];
  return conjugate(base, 2, 'pres');
}

/* ---------- superlativo por reduplicación ---------- */
function superlativo(adj){
  let r = adj.replace(/[oaeu]$/,'');
  r = r.replace(/c$/,'qu').replace(/g$/,'gu').replace(/z$/,'c');
  return r + 'ísimo';
}


/* ============================================================
   8. ÍNDICES
   El inverso (español -> patois) se genera conjugando todo el
   léxico al cargar. Nada se escribe a mano dos veces.
   ============================================================ */
const PW_INDEX = new Map();
const ES_INDEX = new Map();
const ES_EXACT = new Map();

function idxPw(key, val){
  const k = normalize(key);
  if(!PW_INDEX.has(k)) PW_INDEX.set(k, []);
  PW_INDEX.get(k).push(val);
}
function idxEs(key, val){
  const k = normalize(key);
  if(!ES_INDEX.has(k)) ES_INDEX.set(k, []);
  ES_INDEX.get(k).push(val);
  const e = String(key).toLowerCase().trim();
  if(!ES_EXACT.has(e)) ES_EXACT.set(e, []);
  ES_EXACT.get(e).push(val);
}

const COP_PERSON = new Map();
['ser','estar'].forEach(v=>['pres','pret','imp'].forEach(t=>{
  for(let p=0;p<6;p++){
    const f = normalize(conjugate(v,p,t));
    COPULA.add(f);
    if(!COP_PERSON.has(f)) COP_PERSON.set(f, p);
  }
}));

const MODAL_SUBJI = new Map();
[['poder','cuda'],['querer','wuda'],['deber','shuda']].forEach(([lem,pw])=>{
  for(let p=0;p<6;p++){
    const f1 = normalize(subjImperfecto(lem,p)), f2 = normalize(condicional(lem,p));
    if(!MODAL_SUBJI.has(f1)) MODAL_SUBJI.set(f1, {pw, p});
    if(!MODAL_SUBJI.has(f2)) MODAL_SUBJI.set(f2, {pw, p});
  }
});

MODALS.forEach(m=>{
  ['pres','pret','imp'].forEach(t=>{
    for(let p=0;p<6;p++) MODAL_ES.set(normalize(conjugate(m.es,p,t)), m);
  });
});

function rebuildIndex(){
  PW_INDEX.clear(); ES_INDEX.clear(); ES_EXACT.clear();
  PRON.forEach(p=>{
    idxPw(p.pw, {type:'pron', d:p});
    p.es.forEach(e=> idxEs(e, {type:'pron', d:p}));
  });
  VERBS.forEach(v=>{
    idxPw(v.pw, {type:'verb', d:v});
    idxEs(v.es, {type:'verb', d:v, person:2, tense:'inf'});
    ['pres','pret','imp'].forEach(t=>{
      for(let p=0;p<6;p++){
        const form = conjugate(v.es, p, t);
        idxEs(form, {type:'verb', d:v, person:p, tense:t});
      }
    });
    idxEs(gerund(v.es), {type:'verb', d:v, person:2, tense:'ger'});
    idxEs(participio(v.es), {type:'verb', d:v, person:2, tense:'part'});
    for(let p=0;p<6;p++){
      idxEs(condicional(v.es,p), {type:'verb', d:v, person:p, tense:'cond'});
      idxEs(futuroSint(v.es,p),  {type:'verb', d:v, person:p, tense:'fut'});
      idxEs(subjuntivo(v.es,p),  {type:'verb', d:v, person:p, tense:'subj'});
      idxEs(subjImperfecto(v.es,p), {type:'verb', d:v, person:p, tense:'subji'});
    }
    idxEs(imperativo(v.es,false,false), {type:'verb', d:v, person:1, tense:'imp2'});
    idxEs(imperativo(v.es,true,false),  {type:'verb', d:v, person:4, tense:'imp2'});
  });
  NOUNS.forEach(n=>{
    idxPw(n.pw, {type:'noun', d:n});
    idxEs(n.es, {type:'noun', d:n, plural:false});
    idxEs(pluralize(n.es), {type:'noun', d:n, plural:true});
  });
  ADJS.forEach(a=>{
    idxPw(a.pw, {type:'adj', d:a});
    [[false,false],[true,false],[false,true],[true,true]].forEach(([f,p])=>{
      idxEs(agree(a.es, f, p, a.inv), {type:'adj', d:a, fem:f, plural:p});
    });
  });
  FUNC.forEach(f=>{
    idxPw(f.pw, {type:'func', d:f});
    f.es.forEach(e=> idxEs(e, {type:'func', d:f}));
  });
  GLOSSARY.forEach(e=>{
    idxPw(e.headword, {type:'gloss', d:e});
    (e.variants||[]).forEach(v=> idxPw(v, {type:'gloss', d:e}));
  });
}
rebuildIndex();

function lookupPw(word){
  const n = normalize(word);
  if(PW_INDEX.has(n)) return PW_INDEX.get(n);
  const p = phoneticKey(word);
  for(const [k,v] of PW_INDEX) if(phoneticKey(k) === p) return v;
  return null;
}
function lookupEs(word){
  const e = String(word).toLowerCase().trim();
  if(ES_EXACT.has(e)) return ES_EXACT.get(e);
  const n = normalize(word);
  return ES_INDEX.has(n) ? ES_INDEX.get(n) : null;
}

/* ============================================================
   R3: AUTÓMATA DE RANURAS TMA
   Orden fijo del criollo:  [NEG] [did] [a go|wi] [a|done] VERBO
   Los marcadores se apilan. El parser consume todos los que haya
   y compone un valor único antes de emitir.
   ============================================================ */
const M_ANT   = ['did','ben','been','wen','dida'];
const M_FUT   = ['a go','ago','wi','wii','gwine'];
const M_COND  = ['wuda','woulda','cuda','coulda','shuda','shoulda'];
const M_PROG  = ['a','de'];
const M_PERF  = ['done','dun'];
const M_MODAL = {haffi:'tener que', affi:'tener que', hafi:'tener que',
  cyaan:'no poder', kyaan:'no poder', caan:'no poder', can:'poder',
  mus:'deber', must:'deber', waan:'querer', wan:'querer', fimi:'tener que'};

function parseTMA(toks, i){
  const r = {neg:false, ant:false, fut:false, cond:null, prog:false,
             perf:false, modal:null, len:0};
  let k = i, avanzo = true;
  while(k < toks.length && avanzo){
    avanzo = false;
    const w  = normalize(toks[k]);
    const w2 = normalize(toks[k] + ' ' + (toks[k+1] || ''));

    if(!r.neg && (NEG.includes(w) || w === 'neva' || w === 'never')){
      r.neg = true;
      if(w === 'neva' || w === 'never') r.ant2 = true;   /* pasado negado simple */
      if(w === 'nah' || w === 'naa')    r.fut = true;    /* prospectivo negado */
      k++; avanzo = true; continue;
    }
    if(!r.ant && M_ANT.includes(w)){ r.ant = true; k++; avanzo = true; continue; }
    if(!r.cond && M_COND.includes(w)){
      r.cond = w.startsWith('c') ? 'poder' : (w.startsWith('sh') ? 'deber' : 'cond');
      k++; avanzo = true; continue;
    }
    /* `a go` sólo es futuro si detrás viene un verbo. Ante un lugar
       —`mi a go a di shop`— el `go` es el verbo léxico «ir» y el `a`
       que sigue es preposición, no parte del marcador. */
    if(!r.fut && M_FUT.includes(w2)){
      const sig = toks[k+2] ? lookupPw(toks[k+2]) : null;
      const verboDetras = sig && sig.some(h=>h.type === 'verb');
      /* sólo `done` se apila tras `a go`; `a` detrás no es marcador sino
         la preposición de lugar, que es justo el caso que hay que excluir */
      const marcadorDetras = toks[k+2] && M_PERF.includes(normalize(toks[k+2]));
      if(verboDetras || marcadorDetras || !toks[k+2]){
        r.fut = true; k += 2; avanzo = true; continue;
      }
    }
    if(!r.fut && M_FUT.includes(w)){
      r.fut = true;
      if(w === 'wi' || w === 'wii') r.futSint = true;
      k++; avanzo = true; continue;
    }
    if(!r.modal && M_MODAL[w]){ r.modal = M_MODAL[w]; k++; avanzo = true; continue; }
    if(!r.perf && M_PERF.includes(w)){ r.perf = true; k++; avanzo = true; continue; }
    if(!r.prog && M_PROG.includes(w)){
      /* "a" sólo es progresivo si detrás hay verbo */
      const nx = toks[k+1] ? lookupPw(toks[k+1]) : null;
      if(nx && nx.some(h=>h.type === 'verb')){ r.prog = true; k++; avanzo = true; continue; }
    }
  }
  r.len = k - i;
  r.habitual = toks.some(t=>ADV_HABITUAL.includes(normalize(t)));
  return r;
}

/* compone la forma española a partir del valor TMA */
const ADV_HABITUAL = ['every','always','sometime','sometimes','daily','offen','often'];

function realizarTMA(tma, lemma, p){
  if(tma.habitual && !tma.ant && !tma.fut && !tma.prog && !tma.perf && !tma.modal)
    return {t:(tma.neg?'no ':'') + conjugate(lemma, p, 'pres'),
            etiqueta:'ASP adverbio habitual → presente'};
  const est = esEstativo(lemma);
  const neg = '';

  /* Los verbos pronominales colocan el clítico delante de la perífrasis:
     «se está enfriando». Las formas simples ya lo traen de `conjugate`,
     y en las que terminan en infinitivo («va a enfriarse») va enclítico
     dentro del propio lema, así que ahí no se toca nada.               */
  const cl = lemma.endsWith('se') ? ['me','te','se','nos','os','se'][p] + ' ' : '';

  if(tma.modal){
    const m = tma.modal.startsWith('no ')
      ? 'no ' + conjugate(tma.modal.slice(3), p, tma.ant ? 'pret' : 'pres')
      : conjugate(tma.modal.split(' ')[0], p, tma.ant ? 'pret' : 'pres')
        + (tma.modal.includes(' ') ? ' ' + tma.modal.split(' ').slice(1).join(' ') : '');
    return {t: neg + m + ' ' + lemma, etiqueta:'MOD modal'};
  }
  if(tma.cond === 'poder')
    return {t: neg + conjugate('poder', p, 'pres').replace(/o$/,'ría') + ' ' + lemma,
            etiqueta:'COND cuda → condicional de capacidad'};
  if(tma.cond)
    return {t: neg + cl + condicional(lemma, p), etiqueta:'COND wuda → condicional'};

  if(tma.fut){
    if(tma.ant) return {t: neg + conjugate('ir', p, 'imp') + ' a ' + lemma, etiqueta:'FUT futuro en el pasado'};
    if(tma.futSint) return {t: neg + cl + futuroSint(lemma, p), etiqueta:'FUT wi → futuro sintético'};
    return {t: neg + conjugate('ir', p, 'pres') + ' a ' + lemma, etiqueta:'FUT a go → futuro perifrástico'};
  }
  if(tma.ant && tma.perf)
    return {t: neg + 'ya ' + cl + conjugate('haber', p, 'imp') + ' ' + participio(lemma),
            etiqueta:'TMA did done → pasado completivo'};
  if(tma.ant && tma.prog)
    return {t: neg + cl + conjugate('estar', p, 'imp') + ' ' + gerund(lemma),
            etiqueta:'TMA did a → pasado progresivo'};
  if(tma.perf)
    return {t: neg + 'ya ' + cl + conjugate('haber', p, 'pres') + ' ' + participio(lemma),
            etiqueta:'TMA done → completivo'};
  if(tma.ant)
    return {t: neg + cl + conjugate('haber', p, 'imp') + ' ' + participio(lemma),
            etiqueta:'TMA did → anterior (pluscuamperfecto)'};
  if(tma.prog){
    /* el progresivo de «ir» no se perifrasea en español: `mi a go a town`
       es «voy al pueblo», no «estoy yendo al pueblo», que suena forzado */
    if(lemma === 'ir')
      return {t: neg + conjugate('ir', p, 'pres'), etiqueta:'TMA a + ir → presente'};
    return {t: neg + cl + conjugate('estar', p, 'pres') + ' ' + gerund(lemma),
            etiqueta:'TMA a → progresivo'};
  }

  if(tma.ant2)
    return {t: neg + conjugate(lemma, p, 'pret'), etiqueta:'NEG neva → pasado negado'};

  /* verbo desnudo: el tiempo lo decide la clase aspectual */
  return est
    ? {t: neg + conjugate(lemma, p, 'pres'), etiqueta:'ASP verbo estativo desnudo → presente'}
    : {t: neg + conjugate(lemma, p, 'pret'), etiqueta:'ASP verbo dinámico desnudo → pasado'};
}

function futuroSint(lemma, p){
  const irr = {tener:'tendr', poder:'podr', hacer:'har', decir:'dir', poner:'pondr',
    salir:'saldr', venir:'vendr', querer:'querr', saber:'sabr', haber:'habr', valer:'valdr'};
  const base = lemma.endsWith('se') ? lemma.slice(0,-2) : lemma;
  return (irr[base] || base) + ['é','ás','á','emos','éis','án'][p];
}

function condicional(lemma, p){
  const irr = {tener:'tendr', poder:'podr', hacer:'har', decir:'dir', poner:'pondr',
    salir:'saldr', venir:'vendr', querer:'querr', saber:'sabr', haber:'habr', valer:'valdr'};
  const base = lemma.endsWith('se') ? lemma.slice(0,-2) : lemma;
  const raiz = irr[base] ? irr[base] : base;
  return raiz + ['ía','ías','ía','íamos','íais','ían'][p];
}

/* ============================================================
   R1: RECONOCIMIENTO DE PATRONES SINTAGMÁTICOS
   No es un analizador completo, pero cubre los constructos que
   un bucle lineal no puede resolver: focalización, verbos
   seriales, genitivo por yuxtaposición y orden adjetivo-nombre.
   ============================================================ */

function tipoDe(tok, prevTok){
  const h = lookupPw(tok);
  if(!h) return null;
  /* desambiguación posicional: tras determinante gana el nominal */
  if(prevTok){
    const ph = lookupPw(prevTok);
    const det = ph && ph.some(x=>x.type==='func' && ['det','dem'].includes(x.d.t));
    if(det && h.some(x=>x.type==='noun')) return 'noun';
  }
  for(const t of ['verb','noun','adj','pron','func','gloss'])
    if(h.some(x=>x.type===t)) return t;
  return null;
}
function datoDe(tok, tipo){
  const h = lookupPw(tok);
  const x = h && h.find(y=>y.type===tipo);
  return x ? x.d : null;
}

/* ---------- focalización con a-fronting ---------- */
function analizarFoco(toks){
  if(normalize(toks[0]) !== 'a' || toks.length < 3) return null;

  /* a + fi + PRON (+ DEM):  a fi yu dat  →  eso es tuyo */
  if(normalize(toks[1]) === 'fi' && tipoDe(toks[2]) === 'pron'){
    const pr0 = datoDe(toks[2],'pron');
    const ton = {0:'mío',1:'tuyo',2:'suyo',3:'nuestro',4:'vuestro',5:'suyo'}[pr0.p];
    const dm = toks[3] ? normalize(toks[3]) : null;
    /* `fi mi` es el determinante posesivo, así que lo que venga detrás se
       lee como nombre aunque el índice prefiera el verbo: en `a fi mi book`,
       `book` es «libro» y no «reservar». Es la misma desambiguación
       posicional que ya aplica `tipoDe` tras determinante, pero ahí no salta
       porque el token anterior es un pronombre, no un determinante. */
    const h3 = toks[3] ? lookupPw(toks[3]) : null;
    const hayNominal = !!(h3 && h3.some(x=>x.type === 'noun'));
    const suj = dm === 'dat' ? 'eso' : (dm === 'dis' ? 'esto' : 'eso');
    if(!hayNominal && !toks[4])
      return {texto: suj + ' es ' + ton, etiqueta:'FOC posesivo tónico focalizado'};
  }
  const x = toks[1];
  const resto = toks.slice(2);
  const tx = tipoDe(x);

  /* a + VERBO ... (copia verbal):  a run im a run  */
  if(tx === 'verb' && resto.some(t=>normalize(t) === normalize(x))){
    const v = datoDe(x,'verb');
    return {texto:'lo que hace es ' + v.es, etiqueta:'FOC copia verbal → perífrasis de realce'};
  }
  /* a + PRONOMBRE + VP:  a mi dweet  */
  if(tx === 'pron'){
    const pr = datoDe(x,'pron');
    const vTok = resto.find(t=>tipoDe(t) === 'verb' || PHRASE_PW.has(normalize(t)));
    let vp = '';
    if(vTok){
      const vd = datoDe(vTok,'verb');
      vp = vd ? conjugate(vd.es, 2, 'pret') : '';
      if(normalize(vTok) === 'dweet' || normalize(vTok) === 'duit') vp = 'lo hizo';
    }
    const ser = pr.p === 0 ? 'fui' : (pr.p === 1 ? 'fuiste' : (pr.n === 'pl' ? 'fueron' : 'fue'));
    return {texto: ser + ' ' + pr.suj + ' quien ' + vp, etiqueta:'FOC foco sobre sujeto → perífrasis de relativo'};
  }
  /* a + ADVERBIO LOCATIVO + ... :  a yah so mi live  */
  if(tx === 'func' && datoDe(x,'func').t === 'adv'){
    const adv = datoDe(x,'func').es[0];
    let r = resto;
    if(normalize(r[0]) === 'so') r = r.slice(1);
    const sub = pwToEsCore(r);
    return {texto:'es ' + adv + ' donde ' + sub.text.toLowerCase(), etiqueta:'FOC foco locativo'};
  }
  /* a + SN + CLÁUSULA:  a di book mi buy  */
  {
    let k = 1, det = false;
    while(k < toks.length){
      const tk = tipoDe(toks[k], toks[k-1]);
      const esDet2 = tk === 'func' && datoDe(toks[k],'func') &&
                     ['det','dem'].includes(datoDe(toks[k],'func').t);
      if(esDet2){ det = true; k++; continue; }
      if(tk === 'adj'){ k++; continue; }
      if(tk === 'noun' || (det && lookupPw(toks[k]) &&
         lookupPw(toks[k]).some(h=>h.type==='noun'))){ k++; det = false; continue; }
      break;
    }
    if(k > 2){
      const sn  = pwToEsCore(toks.slice(1,k));
      const cl  = pwToEsCore(toks.slice(k));
      return {texto:'fue ' + sn.text.toLowerCase() + ' lo que ' + cl.text.toLowerCase(),
              etiqueta:'FOC foco sobre objeto → perífrasis de relativo'};
    }
  }
  return null;
}

/* ---------- verbos seriales ---------- */
function reescribirSeriales(toks, applied){
  const t = toks.map(x=>normalize(x));

  /* carry OBJ come  →  imperativo de traer */
  let i = t.indexOf('carry');
  if(i > -1 && t.indexOf('come', i) > i){
    const j = t.indexOf('come', i);
    const obj = toks.slice(i+1, j);
    applied.push('SER verbo serial "carry … come" → traer');
    const cl = obj.length === 1 && ['it','dis','dat'].includes(normalize(obj[0]));
    return {texto: cl ? 'tráelo' : 'trae ' + pwToEsCore(obj).text.toLowerCase(), resto: toks.slice(j+1)};
  }
  /* tek SN go  →  llevarse */
  i = t.indexOf('tek');
  if(i > -1 && t.indexOf('go', i) > i){
    const j = t.indexOf('go', i);
    const obj = toks.slice(i+1, j);
    applied.push('SER verbo serial "tek … go" → llevarse');
    return {texto:'llévate ' + pwToEsCore(obj).text.toLowerCase(), resto: toks.slice(j+1)};
  }
  /* V go PP  →  salir + gerundio */
  i = t.indexOf('go');
  if(i > 0 && tipoDe(toks[i-1]) === 'verb'){
    const v = datoDe(toks[i-1],'verb');
    if(v && v.es !== 'ir'){
      const antes = toks.slice(0, i-1);
      const dep   = toks.slice(i+1);
      applied.push('SER verbo serial "V + go" → verbo de movimiento + gerundio');
      const suj = antes.length ? pwToEsCore(antes).text.toLowerCase() : '';
      return {texto:(suj ? '' : '') + 'salió ' + gerund(v.es) + ' ' + pwToEsCore(dep).text.toLowerCase(),
              resto: []};
    }
  }
  /* come V  →  ven a V */
  if(t[0] === 'come' && tipoDe(toks[1]) === 'verb'){
    const v = datoDe(toks[1],'verb');
    applied.push('SER verbo serial "come + V" → ven a + infinitivo');
    return {texto:'ven a ' + v.es + ' ' + pwToEsCore(toks.slice(2)).text.toLowerCase(), resto: []};
  }
  return null;
}

/* ============================================================
   9. PATOIS -> ESPAÑOL
   ============================================================ */
function tokenize(text){
  return text.toLowerCase()
    .replace(/\bal\b/g,'a el').replace(/\bdel\b/g,'de el')
    .replace(/([.,!?¿¡;:])/g,' $1 ')
    .split(/\s+/).filter(Boolean);
}

function pwToEs(text){
  const toks0 = tokenize(text);
  const applied0 = [];

  const foco = analizarFoco(toks0);
  if(foco){
    return {text: foco.texto.charAt(0).toUpperCase() + foco.texto.slice(1),
            coverage:1, unknown:[], applied:[foco.etiqueta], tokens:[{t:foco.texto}]};
  }
  const ser = reescribirSeriales(toks0, applied0);
  if(ser){
    const cola = ser.resto.length ? ' ' + pwToEsCore(ser.resto).text.toLowerCase() : '';
    const txt = (ser.texto + cola).replace(/\s+/g,' ').trim();
    return {text: txt.charAt(0).toUpperCase() + txt.slice(1),
            coverage:1, unknown:[], applied:applied0, tokens:[{t:txt}]};
  }
  return pwToEsCore(toks0);
}

function pwToEsCore(toks){
  const out = [];
  const unknown = [];
  const applied = [];
  let i = 0;
  let subject = null;

  while(i < toks.length){
    const w = toks[i];

    if(/^[.,!?¿¡;:]$/.test(w)){ out.push({t:w, punct:true}); i++; continue; }

    const ph = (typeof PHRASE_PW !== 'undefined') ? matchPhrase(toks, i, PHRASE_PW) : null;
    if(ph){
      out.push({t: ph.hit.es, phrase:true, wh: WH_ES.includes(normalize(ph.hit.es)) ||
        ['por qué','cuánto','cuántos','dónde'].includes(ph.hit.es)});
      applied.push('FRASE "' + ph.hit.pw + '" es expresión hecha, no se descompone');
      i += ph.len;
      continue;
    }

    const hit = lookupPw(w);

    /* Fórmula fija de una sola palabra. `matchPhrase` sólo busca a partir
       de dos tokens, así que entradas como `respect` o `zeen` estaban en
       la tabla sin poder casar nunca. Se comprueba DESPUÉS del léxico y
       sólo si la palabra no está en él, para no pisar ninguna traducción
       que ya funcionaba. */
    if(typeof PHRASE_PW !== 'undefined'){
      const clave  = normalize(w);
      const suelta = PHRASE_PW.get(clave);
      /* La fórmula gana también cuando el léxico sólo llegó por parecido
         fonético: `seen` no está en el índice y acababa cazado por `send`,
         de modo que «seen» salía «envía». Una coincidencia exacta pesa más
         que una aproximada. */
      if(suelta && (!hit || !PW_INDEX.has(clave))){
        out.push({t: suelta.es, phrase:true});
        applied.push('FRASE "' + suelta.pw + '" es fórmula fija de una palabra');
        i++;
        continue;
      }
    }

    /* "wi" es pronombre en posición de sujeto y futuro tras sujeto */
    const esMarcador = M_ANT.includes(normalize(w)) || M_FUT.includes(normalize(w)) ||
                       M_COND.includes(normalize(w)) || M_PERF.includes(normalize(w));

    /* pronombre -> fija el sujeto */
    const trasWh = out.length && out[out.length-1].wh;
    const pron = (!subject || !esMarcador) && hit && hit.find(h=>h.type==='pron');
    if(pron && normalize(w) === 'unu'){
      const nx = toks[i+1] ? lookupPw(toks[i+1]) : null;
      const vb5 = nx && nx.find(x=>x.type==='verb');
      if(vb5){
        out.push({t: imperativo(vb5.d.es, true, false), verbForm:true, lemma:vb5.d.es, imp:true});
        applied.push('IMP "unu" + verbo → imperativo de 2ª plural');
        subject = pron.d;
        i += 2; continue;
      }
    }
    if(pron && trasWh && !subject){
      subject = pron.d;
      out.push({t: pron.d.suj, sujeto:true, trasWh:true});
      i++; continue;
    }
    const trasComp = out.length && (out[out.length-1].comp || out[out.length-1].rel);
    if(pron){
      if(!subject && (out.every(o=>o.punct) || trasComp)){
        subject = pron.d;
        out.push({t: pron.d.suj});
      } else {
        const nh5 = toks[i+1] ? lookupPw(toks[i+1]) : null;
        if(nh5 && nh5.some(h=>h.type==='noun')){
          out.push({t: pron.d.pos, poses:true});
          applied.push('POS pronombre ante sustantivo → posesivo');
        } else {
          out.push({t: pron.d.obj, objPron:true});
          applied.push('OBJ pronombre objeto "' + w + '" → ' + pron.d.obj);
        }
      }
      i++;
      continue;
    }

    /* --- R9: reduplicación --- */
    if(toks[i+1] && normalize(toks[i]) === normalize(toks[i+1])){
      const h2 = lookupPw(w);
      const adj2 = h2 && h2.find(x=>x.type==='adj');
      const vb2  = h2 && h2.find(x=>x.type==='verb');
      if(normalize(w) === 'likkle' || normalize(w) === 'lickle'){
        out.push({t:'poquito a poco'});
        applied.push('RED reduplicación atenuativa');
        i += 2; continue;
      }
      if(adj2){
        const prevNoun = [...out].reverse().find(o=>o.noun);
        const fem = prevNoun ? prevNoun.noun.g === 'f' : false;
        let sup = superlativo(adj2.d.es);
        if(fem) sup = sup.replace(/o$/,'a');
        if(!out.some(o=>o.verbForm) && prevNoun)
          out.push({t: conjugate('ser', prevNoun.plural?5:2, 'pres'), verbForm:true, lemma:'ser', cop:true});
        out.push({t: sup});
        applied.push('RED reduplicación intensiva → superlativo');
        i += 2; continue;
      }
      if(vb2){
        const p3 = subject ? subject.p : 2;
        const f = conjugate(vb2.d.es, p3, 'pres');
        out.push({t: f + ' y ' + f, verbForm:true, lemma:vb2.d.es});
        applied.push('RED reduplicación iterativa');
        i += 2; continue;
      }
    }

    /* --- R8: complementantes y relativizador --- */
    if(normalize(w) === 'seh' && out.some(o=>o.verbForm)){
      out.push({t:'que', comp:true});
      applied.push('SUB "seh" complementante → que');
      subject = null;
      i++; continue;
    }
    if(normalize(w) === 'weh' && out.some(o=>o.noun) && !out.some(o=>o.verbForm)){
      out.push({t:'que', rel:true});
      applied.push('SUB "weh" relativizador → que');
      subject = null;
      i++; continue;
    }
    if(normalize(w) === 'fi' && toks[i+1] && tipoDe(toks[i+1]) === 'pron'){
      const pr2 = datoDe(toks[i+1],'pron');
      const nd2 = toks[i+2] ? datoDe(toks[i+2],'noun') : null;
      if(nd2){
        out.push({t: pr2.pos, poses:true});
        out.push({t: nd2.es, noun:nd2});
        applied.push('SN posesivo con "fi" → posesivo español');
        i += 3; continue;
      }
      if(!toks[i+2]){
        const tuyo = {0:'mío',1:'tuyo',2:'suyo',3:'nuestro',4:'vuestro',5:'suyo'}[pr2.p];
        out.push({t: tuyo});
        applied.push('SN posesivo tónico con "fi"');
        i += 2; continue;
      }
    }
    if(normalize(w) === 'fi'){
      const nx = toks[i+1] ? lookupPw(toks[i+1]) : null;
      if(nx && nx.some(x=>x.type==='verb')){
        const vb3 = nx.find(x=>x.type==='verb');
        const pendiente = [...out].reverse().find(o=>o.objPron);
        if(pendiente){
          /* waan + PRON + fi + V  →  querer que + subjuntivo */
          const pr = PRON.find(x=>x.obj === pendiente.t);
          out.splice(out.indexOf(pendiente), 1);
          out.push({t:'que'});
          out.push({t: subjuntivo(vb3.d.es, pr ? pr.p : 1), verbForm:true, lemma:vb3.d.es});
          applied.push('SUB "fi" con sujeto → que + subjuntivo');
        } else {
          out.push({t: vb3.d.es, verbForm:true, lemma:vb3.d.es});
          applied.push('SUB "fi" infinitivo → sin marca en español');
        }
        i += 2; continue;
      }
    }
    if(normalize(w) === 'mek'){
      const nx1 = toks[i+1] ? lookupPw(toks[i+1]) : null;
      const pr  = nx1 && nx1.find(x=>x.type==='pron');
      const nx2 = toks[i+2] ? lookupPw(toks[i+2]) : null;
      const vb4 = nx2 && nx2.find(x=>x.type==='verb');
      if(pr && vb4){
        out.push({t:'déja' + pr.d.obj.replace('lo','lo').replace('me','me'), verbForm:true, lemma:'dejar'});
        out.push({t: vb4.d.es});
        applied.push('SUB causativo "mek" → dejar + infinitivo');
        i += 3; continue;
      }
    }

    /* --- cópula supletiva: a (ecuativa) / deh (locativa) / cero (adjetival) --- */
    const w0 = normalize(w);
    if(['a','de','deh'].includes(w0) && out.some(o=>o.cop)){
      out.push({t:'en', prep:true});
      applied.push('PREP "a" tras cópula → preposición de lugar');
      i++; continue;
    }
    if(w0 === 'a' && i === 0 && toks[1] && tipoDe(toks[1]) === 'noun' && !out.length){
      out.push({t:'a', prep:true});
      applied.push('PREP "a" inicial ante nominal → preposición de lugar');
      i++; continue;
    }
    /* Tras verbo de movimiento, `a` es preposición de lugar: `guh a shop`
       es «ve a la tienda». Esta comprobación va ANTES que la cópula porque
       si no, la rama de cópula se lleva el token y sale «ve es tiendas».
       La misma regla existía más abajo en el bucle, inalcanzable. */
    const MOTION = ['ir','venir','llegar','volver','viajar','subir','salir',
                    'correr','andar','seguir','entrar','bajar','pasar'];
    if(w0 === 'a' && out.length && toks[i+1]){
      const ultimoV = [...out].reverse().find(o=>o.verbForm);
      const sigH = lookupPw(toks[i+1]);
      const sigVerbo = sigH && sigH.some(h=>h.type === 'verb');
      if(ultimoV && MOTION.includes(ultimoV.lemma) && !sigVerbo){
        out.push({t:'a', prep:true});
        applied.push('PREP "a" tras verbo de movimiento → preposición de lugar');
        i++; continue;
      }
    }

    if(['a','de','deh'].includes(w0)){
      const nx  = toks[i+1];
      const nh  = nx ? lookupPw(nx) : null;
      const hayVerbo = nh && nh.some(h=>h.type==='verb');
      if(!hayVerbo && nx){
        const p   = subject ? subject.p : 2;
        const loc = w0 === 'deh' ||
                    (normalize(nx) !== 'fi' && nh &&
                     nh.some(h=>h.type==='func' && (h.d.t==='adv' || h.d.t==='prep')));
        const ant = out.some(o=>o.pendAnt);
        const cop = loc ? 'estar' : 'ser';
        out.push({t: conjugate(cop, p, ant ? 'imp' : 'pres'), verbForm:true, lemma:cop, cop:true});
        applied.push('COP cópula ' + (loc ? 'locativa (deh) → estar' : 'ecuativa (a) → ser'));
        i++;
        continue;
      }
    }

    /* --- autómata de ranuras TMA --- */
    const trasDet0 = out.length && out[out.length-1].det;
    const tma = parseTMA(toks, i);
    if(!(trasDet0 && hit && hit.some(h=>h.type==='noun')) &&
       (tma.len > 0 || (hit && hit.some(h=>h.type==='verb')))){
      const j = i + tma.len;
      const vh = toks[j] ? lookupPw(toks[j]) : null;
      const vb = vh && vh.find(h=>h.type==='verb');

      /* incoativa: se resuelve antes que el verbo suelto, porque el
         verbo ligero por su cuenta traduce otra cosa («get» → conseguir) */
      {
        const nomPrev = [...out].reverse().find(o=>o.noun);
        const femInc  = nomPrev ? nomPrev.noun.g === 'f' : !!(subject && subject.fem);
        const plInc   = nomPrev ? !!nomPrev.plural : false;
        const inc = analizarIncoativa(toks, j, femInc, plInc);
        if(inc){
          const p = subject ? subject.p : (nomPrev && nomPrev.plural ? 5 : 2);
          const r = realizarTMA(tma, inc.lemma, p);
          if(tma.neg) out.push({t:'no', neg:true});
          out.push({t: r.t + (inc.cola ? ' ' + inc.cola : ''),
                    verbForm:true, lemma: inc.lemma});
          applied.push(inc.etiqueta);
          applied.push(r.etiqueta);
          i = j + inc.len;
          continue;
        }
      }

      if(vb){
        /* verbo inicial sin sujeto explícito = imperativo */
        if(!subject && !out.some(o=>!o.punct) && !tma.ant && !tma.fut && !tma.prog && !tma.perf && !tma.modal){
          out.push({t: imperativo(vb.d.es, false, tma.neg), verbForm:true, lemma:vb.d.es, imp:true});
          applied.push('IMP verbo inicial sin sujeto → imperativo');
          i = j + 1; continue;
        }
        const p = subject ? subject.p : 2;
        const r = realizarTMA(tma, vb.d.es, p);
        if(tma.neg) out.push({t:'no', neg:true});
        out.push({t: r.t, verbForm:true, lemma: vb.d.es});
        applied.push(r.etiqueta);
        i = j + 1;
        continue;
      }

      /* marcador anterior sin verbo: lo hereda la cópula o el adjetivo */
      if(tma.len > 0 && tma.ant && !vb){
        out.push({t:'', pendAnt:true, oculto:true});
        applied.push('TMA did hereda anterioridad al predicado');
        i += tma.len;
        continue;
      }

      /* marcadores sin verbo detrás: cópula o preposición */
      if(tma.len > 0){
        const nxt = toks[i + tma.len];
        const nh  = nxt ? lookupPw(nxt) : null;
        const p   = subject ? subject.p : 2;
        const w0  = normalize(w);

        /* el futuro se comprueba primero: `mi a go` empieza por `a`, que
           también es progresivo, y si gana la cópula sale «soy» en vez
           de «voy» */
        if(tma.fut){
          out.push({t:(tma.neg?'no ':'') + conjugate('ir', p, tma.ant ? 'imp' : 'pres'),
                    verbForm:true, lemma:'ir'});
          applied.push('FUT marcador de futuro sin verbo → ir');
          i += tma.len; continue;
        }
        if(tma.prog || M_PROG.includes(w0) || w0 === 'deh'){
          const loc = w0 === 'deh' || (nh && nh.some(h=>h.type==='func' && (h.d.t==='adv'||h.d.t==='prep')));
          const cop = loc ? 'estar' : 'ser';
          const t   = tma.ant ? 'imp' : 'pres';
          out.push({t:(tma.neg?'no ':'') + conjugate(cop, p, t), verbForm:true, lemma:cop, cop:true});
          applied.push('COP cópula ' + (loc ? 'locativa (deh) → estar' : 'ecuativa (a) → ser'));
          i += Math.max(tma.len, 1);
          continue;
        }
      }
    }

    if(NEG_PRO[normalize(w)]){
      out.push({t: NEG_PRO[normalize(w)]});
      applied.push('NEG pronombre negativo "' + w + '"');
      i++; continue;
    }

    /* negación — se marca, se colapsa al final */
    if(NEG.includes(normalize(w))){
      out.push({t:'no', neg:true});
      applied.push('NEG negador "' + w + '" marcado a nivel de cláusula');
      i++;
      continue;
    }

    /* "a" tras verbo de movimiento es preposición de lugar, no cópula */
    if(normalize(w) === 'a' && out.length){
      const prev = [...out].reverse().find(o=>o.verbForm);
      const MOTION = ['ir','venir','llegar','volver','viajar','subir','salir','correr','andar','seguir'];
      if(prev && MOTION.includes(prev.lemma)){
        out.push({t:'a', prep:true});
        applied.push('PREP "a" tras verbo de movimiento → preposición de lugar');
        i++; continue;
      }
    }

    /* verbo desnudo: la clase aspectual decide el tiempo */
    const trasDet1 = out.length && out[out.length-1].det;
    const verb = !(trasDet1 && hit && hit.some(h=>h.type==='noun')) &&
                 hit && hit.find(h=>h.type==='verb');
    if(verb){
      const p = subject ? subject.p : 2;
      const r = realizarTMA({neg:false}, verb.d.es, p);
      out.push({t: r.t, verbForm:true, lemma:verb.d.es});
      applied.push(r.etiqueta);
      i++;
      continue;
    }

    /* sustantivo, con plural analítico si le sigue "dem" */
    /* demostrativo + N + deh: el "deh" pospuesto no se traduce */
    if(normalize(toks[i+1]||'') === 'deh' && out.some(o=>o.noun) && !toks[i+2]){
      /* se resuelve al final */
    }

    /* adjetivo antepuesto: el español lo pospone */
    const adjPre = hit && hit.find(h=>h.type==='adj');
    if(adjPre && toks[i+1] && tipoDe(toks[i+1]) === 'noun'){
      const nd = datoDe(toks[i+1],'noun');
      const isPl2 = normalize(toks[i+2]||'') === 'dem';
      const art2 = [...out].reverse().find(o=>o.det);
      if(art2 && !art2.dem){
        const g = nd.g === 'f';
        art2.t = art2.artType==='indef' ? (g?'una':'un')
               : (isPl2 ? (g?'las':'los') : (g?'la':'el'));
      }
      out.push({t: isPl2 ? pluralize(nd.es) : nd.es, noun:nd, plural:isPl2});
      out.push({t: agree(adjPre.d.es, nd.g==='f', isPl2, adjPre.d.inv)});
      applied.push('SN adjetivo antepuesto → pospuesto en español');
      i += isPl2 ? 3 : 2;
      continue;
    }

    const INCONTABLE = new Set(['dinero','agua','comida','gente','ropa','arroz','pan',
      'leche','música','tiempo','trabajo','ayuda','suerte','sal','azúcar','carne',
      'aire','hambre','sed','paz','información','basura']);

    const ANIMADO = new Set(['hombre','mujer','chico','chica','niño','hermano','hermana',
      'amigo','madre','padre','profesor','médico','persona','gente','hijo','hija','abuelo',
      'abuela','vecino','jefe','policía','estudiante','cliente','bebé','joven','tío','tía']);

    const noun = hit && hit.find(h=>h.type==='noun');
    if(noun){
      const isPl = normalize(toks[i+1]||'') === 'dem';
      const art = [...out].reverse().find(o=>o.det);
      if(art && !art.dem){
        const g = noun.d.g === 'f';
        art.t = art.artType==='indef' ? (g?'una':'un')
              : (isPl ? (g?'las':'los') : (g?'la':'el'));
        if(isPl) applied.push('CONC artículo concuerda en plural');
      }
      /* objeto directo animado lleva "a" en español */
      const trasVerbo = out.some(o=>o.verbForm) &&
                        !out.slice(out.findIndex(o=>o.verbForm)).some(o=>o.prep);
      if(trasVerbo && ANIMADO.has(noun.d.es) && art){
        art.t = art.t === 'el' ? 'al' : 'a ' + art.t;
        applied.push('ESP objeto directo animado → "a" personal');
      }
      const sigNoun = toks[i+1] && tipoDe(toks[i+1]) === 'noun' &&
                      !['dem'].includes(normalize(toks[i+1]));
      if(sigNoun && !out.some(o=>o.verbForm) && art){
        const poseido = datoDe(toks[i+1],'noun');
        if(art) art.t = poseido.g === 'f' ? 'la' : 'el';
        out.push({t: poseido.es, noun:poseido});
        out.push({t:'de'});
        out.push({t: noun.d.g === 'f' ? 'la' : 'el'});
        out.push({t: noun.d.es, noun:noun.d});
        applied.push('SN genitivo por yuxtaposición → N2 de N1');
        i += 2;
        continue;
      }
      const SIN_ART = new Set(['casa','clase','misa','mano','pie','tierra','mar','cama']);
      if(!art && !SIN_ART.has(noun.d.es) && out.length && out[out.length-1].prep){
        out.push({t: noun.d.g === 'f' ? 'la' : 'el', det:true, artType:'def'});
        applied.push('SN nominal tras preposición → artículo definido');
      }
      out.push({t: isPl ? pluralize(noun.d.es) : noun.d.es, noun:noun.d, plural:isPl});
      if(!subject) subject = PRON.find(x=>x.p === (isPl?5:2));
      /* sustantivo desnudo tras verbo: plural indefinido en español */
      if(!art && !isPl && !INCONTABLE.has(noun.d.es) &&
         out.some(o=>o.verbForm && !o.cop) &&
         !out.some(o=>o.poses) && !out.some(o=>o.prep)){
        const u = out[out.length-1];
        u.t = pluralize(noun.d.es);
        applied.push('SN nominal desnudo → plural indefinido');
      }
      if(isPl){ applied.push('PL "' + noun.d.pw + ' dem" → plural'); i++; }
      i++;
      continue;
    }

    const ADVERBIAL = {bueno:'bien', malo:'mal', rápido:'rápido', lento:'despacio',
      fuerte:'fuerte', duro:'duro', tranquilo:'tranquilo'};
    const adj = hit && hit.find(h=>h.type==='adj');
    if(adj && out.length && out[out.length-1].verbForm && ADVERBIAL[adj.d.es]){
      out.push({t: ADVERBIAL[adj.d.es]});
      applied.push('ADV adjetivo tras verbo → adverbio');
      i++; continue;
    }
    if(adj){
      const prevNoun = [...out].reverse().find(o=>o.noun);
      const fem = prevNoun ? prevNoun.noun.g === 'f' : (subject && subject.fem);
      const pl  = prevNoun ? prevNoun.plural : false;
      /* cópula cero: si no hay verbo delante, insertar "estar" */
      const hasVerb = out.some(o=>o.t && !o.punct);
      if(subject && !out.some(o=>o.verbForm)){
        const ant = out.some(o=>o.pendAnt);
        out.push({t: conjugate('estar', subject.p, ant ? 'imp' : 'pres'), verbForm:true, lemma:'estar', cop:true});
        applied.push('COP0 cópula cero → estar' + (ant ? ' (imperfecto por did)' : ''));
      }
      out.push({t: agree(adj.d.es, fem, pl, adj.d.inv)});
      i++;
      continue;
    }

    const fn = hit && hit.find(h=>h.type==='func');
    if(fn){
      const esDet = fn.d.t==='det' || fn.d.t==='dem';
      const neutro = fn.d.t === 'dem' && (!toks[i+1] || tipoDe(toks[i+1], w) !== 'noun');
      let formaDem = fn.d.es[0];
      if(fn.d.t === 'dem' && !neutro){
        const nSig = datoDe(toks[i+1],'noun');
        if(nSig && nSig.g === 'f') formaDem = fn.d.pw === 'dis' ? 'esta' : 'esa';
      }
      out.push({t: neutro ? (fn.d.pw === 'dis' ? 'esto' : 'eso') : formaDem,
                det: esDet && !neutro, dem: fn.d.t==='dem',
                artType: fn.d.pw==='wan'?'indef':'def'});
      i++; continue;
    }

    const gl = hit && hit.find(h=>h.type==='gloss');
    if(gl){ out.push({t: gl.d.senses[0].es, gloss:gl.d}); applied.push('GLOS entrada "' + gl.d.headword + '"'); i++; continue; }

    unknown.push(w);
    out.push({t: w, unk:true});
    i++;
  }

  return finish(out, unknown, applied, toks.length, {foco:false});
}

/* ============================================================
   10. ESPAÑOL -> PATOIS
   ============================================================ */
function esToPw(text){
  const toks = tokenize(text);
  const out = [];
  const unknown = [];
  const applied = [];
  let i = 0;
  let subject = null;

  while(i < toks.length){
    const w = toks[i];
    if(/^[.,!?¿¡;:]$/.test(w)){ out.push({t:w, punct:true}); i++; continue; }

    if(['me','te','se','nos','os'].includes(normalize(w)) && toks[i+1]){
      /* forma pronominal completa: "me levanto" → levantarse */
      const unidad = lookupEs(w + ' ' + toks[i+1]);
      const vu = unidad && unidad.find(h=>h.type==='verb');
      if(vu){
        if(!subject) subject = PRON.find(x=>x.p === (vu.person||0)) || PRON[0];
        if(!out.some(o=>!o.punct && !o.neg)) out.push({t: subject.pw});
        out.push({t: vu.d.pw, verbForm:true});
        applied.push('REFL verbo pronominal reconocido como unidad');
        i += 2; continue;
      }
      /* impersonal: "se dice" → dem + verbo */
      if(normalize(w) === 'se'){
        const nh6 = lookupEs(toks[i+1]);
        const vi = nh6 && nh6.find(h=>h.type==='verb');
        if(vi){
          out.push({t:'dem'});
          out.push({t: vi.d.es === 'decir' ? 'seh' : vi.d.pw, verbForm:true});
          applied.push('IMP impersonal "se" → sujeto genérico dem');
          i += 2;
          /* "que es ADJ" → it + ADJ */
          if(normalize(toks[i]||'') === 'que' && COPULA.has(normalize(toks[i+1]||''))){
            const na = toks[i+2] ? lookupEs(toks[i+2]) : null;
            const aj = na && na.find(h=>h.type==='adj');
            if(aj){
              out.push({t:'it'});
              out.push({t: aj.d.pw});
              applied.push('SUB "que es ADJ" → it + adjetivo');
              i += 3;
            }
          }
          continue;
        }
      }
      const nh4 = lookupEs(toks[i+1]);
      if(nh4 && nh4.some(h=>h.type==='verb')){
        applied.push('REFL clítico reflexivo sin equivalente en criollo');
        i++; continue;
      }
    }

    const ph = (typeof PHRASE_ES !== 'undefined') ? matchPhrase(toks, i, PHRASE_ES) : null;
    if(ph){
      const esLoc = /^(a back|a front|unda|pon top a|inna|outa|nex to|roun)$/.test(ph.hit.pw);
      out.push({t: ph.hit.pw, phrase:true, prep:esLoc});
      applied.push('FRASE "' + ph.hit.es + '" es expresión hecha, no se descompone');
      i += ph.len;
      continue;
    }

    const hit = lookupEs(w);

    if(normalize(w) === 'no'){
      out.push({t:'nuh', neg:true});
      applied.push('NEG "no" → nuh');
      i++;
      continue;
    }

    /* `haber` impersonal. El criollo no tiene un verbo existencial suelto:
       o pospone el locativo `deh` al sintagma —«weh wan party deh?»— o usa
       el existencial `it have`. La pregunta locativa pide lo primero; el
       resto, lo segundo. */
    if(['hay','habia','habra'].includes(normalize(w))){
      /* `había`/`habrá` también son el auxiliar del pluscuamperfecto y del
         futuro compuesto: con un participio detrás, «había comido» no tiene
         nada de existencial y le toca al tratamiento normal del verbo. */
      const sig = toks[i+1] ? lookupEs(toks[i+1]) : null;
      const participioDetras = sig && sig.some(h => h.type === 'verb' && h.tense === 'part');
      if(!participioDetras){
        const enPregunta = out.some(o => normalize(o.t) === 'weh');
        if(enPregunta){
          out.push({t:'', posponerDeh:true, oculto:true});
          applied.push('EXIST "' + w + '" en pregunta locativa → deh pospuesto');
        } else {
          /* el sujeto expletivo va DELANTE del negador: «it nuh have wata» */
          const ultimo = out.length ? out[out.length-1] : null;
          if(ultimo && ultimo.neg) out.splice(out.length - 1, 0, {t:'it'});
          else out.push({t:'it'});
          out.push({t:'have', verbForm:true});
          applied.push('EXIST "' + w + '" → existencial "it have"');
        }
        i++; continue;
      }
    }

    /* cópula: se evalúa antes que nada, "está" colisiona con "esta" */
    if(COPULA.has(normalize(w)) && ['mas','menos'].includes(normalize(toks[i+1]||''))){
      if(!out.some(o=>!o.punct)) out.push({t:'it'});
      applied.push('COP0 cópula omitida ante comparativo (sujeto expletivo "it")');
      i++; continue;
    }
    if(COPULA.has(normalize(w))){
      const cp = COP_PERSON.get(normalize(w));
      if(!subject) subject = PRON.find(x=>x.p === cp) || PRON[0];
      const nx = toks[i+1];
      const nh = nx ? lookupEs(nx) : null;
      /* una locución de lugar que empieza aquí exige cópula locativa */
      const locFrase = (typeof PHRASE_ES !== 'undefined') && (function(){
        const m = matchPhrase(toks, i+1, PHRASE_ES);
        return m && /^(a back|a front|unda|pon top a|inna|outa|nex to|roun)$/.test(m.hit.pw);
      })();
      const sigueGerundio = nh && nh.some(h=>h.type==='verb' && h.tense==='ger');
      const sigueAdj = nh && nh.some(h=>h.type==='adj');
      if(sigueGerundio){ applied.push('COP0 cópula absorbida por el progresivo'); i++; continue; }
      if(sigueAdj){
        if(!out.some(o=>o.t && !o.punct && !o.neg)) out.push({t: subject.pw});
        out.push({t:'', copOmitida:true, oculto:true});
        applied.push('COP0 cópula omitida ante adjetivo (predicativo)');
        i++; continue;
      }
      const hayWhLoc = out.some(o=>o.t === 'weh');
      const locativo = hayWhLoc || locFrase ||
        (nh && nh.some(h=>h.type==='func' && (h.d.t==='adv' || h.d.t==='prep')));
      if(!out.some(o=>o.t && !o.punct && !o.neg)) out.push({t: subject.pw});
      out.push({t: locativo ? 'deh' : 'a'});
      applied.push(locativo ? 'COP cópula locativa → deh' : 'COP cópula ecuativa → a');
      i++; continue;
    }

    const det = hit && hit.find(h=>h.type==='func' && (h.d.t==='det'||h.d.t==='dem'));
    if(det){
      out.push({t: det.d.pw, det:true, detPl: !!(det.d.pl && det.d.pl.includes(normalize(w)))});
      i++; continue;
    }
    const pron = hit && hit.find(h=>h.type==='pron');
    if(pron){ subject = pron.d; out.push({t: pron.d.pw}); i++; continue; }

    if(normalize(w) === 'que' && out.some(o=>o.verbForm)){
      const sig = toks[i+1] ? lookupEs(toks[i+1]) : null;
      if(sig && sig.some(h=>h.type==='verb' && h.tense==='subj')){
        out.push({t:'que', marcaSubj:true});
      } else applied.push('SUB "que" absorbido');
      i++; continue;
    }

    const msi = MODAL_SUBJI.get(normalize(w));
    if(msi){
      const nh7 = toks[i+1] ? lookupEs(toks[i+1]) : null;
      const vi7 = nh7 && nh7.find(h=>h.type==='verb');
      const pr7 = PRON.find(x=>x.p === msi.p) || PRON[0];
      out.push({t: pr7.pw});
      out.push({t: msi.pw + (vi7 ? ' ' + vi7.d.pw : ''), verbForm:true});
      applied.push('COND modal en subjuntivo/condicional → ' + msi.pw);
      i += vi7 ? 2 : 1;
      continue;
    }

    const mod = MODAL_ES.get(normalize(w));
    if(mod){
      let j = i + 1;
      if(mod.que && normalize(toks[j]) === 'que') j++;
      const nh = toks[j] ? lookupEs(toks[j]) : null;
      const esDeterminante = nh && nh.some(h=>h.type==='func' &&
        ['det','dem','num'].includes(h.d.t));
      const inf = !esDeterminante && nh &&
        nh.find(h=>h.type==='verb' && ['inf','pres','subj'].includes(h.tense) && h.person === 2)
        || (!esDeterminante && nh && nh.find(h=>h.type==='verb' && h.tense === 'inf'));
      
      if(inf){
        const cp = COP_PERSON.has(normalize(w)) ? COP_PERSON.get(normalize(w)) : null;
        const pm = [...MODAL_ES.keys()], _p = (function(){
          for(let t of ['pres','pret','imp']) for(let k=0;k<6;k++)
            if(normalize(conjugate(mod.es,k,t)) === normalize(w)) return k;
          return 2;
        })();
        if(!subject) subject = PRON.find(x=>x.p === _p) || PRON[0];
        if(!out.some(o=>!o.punct && !o.neg && (o.det || o.t === subject.pw))) {
          const at = out.findIndex(o=>o.neg);
          if(at > -1) out.splice(at, 0, {t: subject.pw}); else out.push({t: subject.pw});
        }
        const negIdx = out.findIndex(o=>o.neg);
        if(negIdx > -1 && mod.neg){ out.splice(negIdx,1); out.push({t: mod.neg + ' ' + inf.d.pw}); applied.push('MOD "no ' + w + '" → ' + mod.neg); }
        else { out.push({t: mod.pw + ' ' + inf.d.pw}); applied.push('MOD "' + w + '" → ' + mod.pw); }
        i = j + 1;
        continue;
      }
    }

    const ult = out.length ? out[out.length-1] : null;
    const trasDet = ult && (ult.det || ult.prep ||
      (ult.t && ['inna','pon','wid','fram','a','outa','unda','roun','nex to','a back','a front','pon top a'].includes(String(ult.t).trim())));
    if(trasDet && hit && hit.some(h=>h.type==='noun')){
      const nn = hit.find(h=>h.type==='noun');
      out.push({t: nn.d.pw, nom:true});
      if(nn.plural){ out.push({t:'dem'}); applied.push('PL plural → sustantivo + dem'); }
      else { const d=[...out].reverse().find(o=>o.det); if(d && d.detPl){ out.push({t:'dem'}); } }
      i++; continue;
    }

    /* --- auxiliar haber + participio --- */
    if(/^(he|has|ha|hemos|habéis|han|había|habías|habíamos|habíais|habían)$/.test(normalize(w))
       || ['he','has','ha','hemos','habeis','han','habia','habias','habiamos','habiais','habian'].includes(normalize(w))){
      const nh2 = toks[i+1] ? lookupEs(toks[i+1]) : null;
      const part = nh2 && nh2.find(h=>h.type==='verb' && h.tense==='part');
      if(part){
        const anterior = /^hab/.test(normalize(w));
        if(!subject) subject = PRON[0];
        if(!out.some(o=>!o.punct && !o.neg)) out.push({t: subject.pw});
        out.push({t: (anterior ? 'did ' : 'done ') + part.d.pw});
        applied.push(anterior ? 'TMA pluscuamperfecto → did + verbo'
                              : 'TMA perfecto compuesto → done + verbo');
        i += 2; continue;
      }
    }

    let verb = hit && hit.find(h=>h.type==='verb');
    /* "fuera", "sea", "vaya" son formas raras que colisionan con
       adverbios y preposiciones de uso mucho más frecuente */
    if(verb && ['subj','subji'].includes(verb.tense) &&
       hit.some(h=>h.type==='func' || h.type==='adj')) verb = null;
    if(verb){
      const p = verb.person !== undefined ? verb.person : 2;
      if(!subject) subject = PRON.find(x=>x.p === p) || PRON[0];
      const util = out.filter(o=>!o.punct && !o.neg);
      const hayNominal = util.length > 0;
      if(!hayNominal) out.unshift({t: subject.pw});

      const habitual = toks.some(t=>['siempre','veces','diario','dia','dias','cada','todos'].includes(normalize(t)));
      if(verb.tense === 'pret'){
        /* el verbo dinámico desnudo YA es pasado en criollo: did sería anterior */
        out.push({t: esEstativo(verb.d.es) ? 'did ' + verb.d.pw : verb.d.pw, verbForm:true});
        applied.push('ASP pretérito → verbo desnudo (el dinámico desnudo ya es pasado)');
      } else if(verb.tense === 'subji'){
        out.push({t: (verb.d.es === 'poder' ? 'cuda' : 'wuda') + ' ' + verb.d.pw, verbForm:true});
        applied.push('COND subjuntivo imperfecto → cuda/wuda + verbo');
      } else if(verb.tense === 'cond'){
        out.push({t: 'wuda ' + verb.d.pw, verbForm:true});
        applied.push('COND condicional → wuda + verbo');
      } else if(verb.tense === 'fut'){
        out.push({t: 'a go ' + verb.d.pw, verbForm:true});
        applied.push('FUT futuro → a go + verbo');
      } else if(verb.tense === 'subj'){
        const tieneQue = out.length && normalize(out[out.length-1].t) === 'que';
        if(tieneQue){
          out.pop();
          const pr4 = PRON.find(x=>x.p === p) || PRON[1];
          out.push({t: pr4.pw});
          out.push({t:'fi ' + verb.d.pw, verbForm:true});
          applied.push('SUB "que + subjuntivo" → PRON + fi + verbo');
          i++; continue;
        }
        const yaFi = out.length && /(^| )fi$/.test(String(out[out.length-1].t||''));
        if(yaFi){ out.push({t: verb.d.pw, verbForm:true}); applied.push('SUB subjuntivo tras fi'); i++; continue; }
        const negIni = out.filter(o=>!o.punct && !o.neg).length === 0 && out.some(o=>o.neg);
        if(negIni){
          out.length = 0;
          out.push({t:'nuh', neg:true});
          out.push({t: verb.d.pw, verbForm:true});
          applied.push('IMP imperativo negativo → nuh + verbo desnudo');
        } else {
          out.push({t: 'fi ' + verb.d.pw, verbForm:true});
          applied.push('SUB subjuntivo → fi + verbo');
        }
      } else if(verb.tense === 'imp2'){
        out.push({t: verb.d.pw, verbForm:true});
        applied.push('IMP imperativo → verbo desnudo');
      } else if(verb.tense === 'pres' && !esEstativo(verb.d.es) && !habitual){
        const negado = out.some(o=>o.neg);
        out.push({t: (negado ? '' : 'a ') + verb.d.pw, verbForm:true});
        applied.push(negado ? 'ASP presente negado → verbo desnudo'
                            : 'ASP presente dinámico → a + verbo (progresivo)');
      } else if(verb.tense === 'ger'){
        out.push({t: 'a ' + verb.d.pw, verbForm:true});
        applied.push('PROG gerundio → a + verbo');
      } else if(verb.tense === 'imp'){
        out.push({t: 'did a ' + verb.d.pw, verbForm:true});
        applied.push('IMPF imperfecto → did a + verbo');
      } else {
        /* perífrasis "ir a + inf" -> a go */
        const nx = toks[i+1], nx2 = toks[i+2];
        if(verb.d.es === 'ir' && normalize(nx) === 'a' && nx2){
          const nv = lookupEs(nx2);
          const inf = nv && nv.find(h=>h.type==='verb');
          if(inf){
            out.push({t:'a go ' + inf.d.pw});
            applied.push('FUT "ir a + inf" → a go + verbo');
            i += 3;
            continue;
          }
        }
        out.push({t: verb.d.pw, verbForm:true});
      }
      i++;
      continue;
    }

    const noun = hit && hit.find(h=>h.type==='noun');
    if(noun){
      out.push({t: noun.d.pw, nom:true});
      if(noun.plural){ out.push({t:'dem'}); applied.push('PL plural → sustantivo + dem'); }
      else { const d=[...out].reverse().find(o=>o.det); if(d && d.detPl){ out.push({t:'dem'}); applied.push('PL determinante plural → + dem'); } }
      i++;
      continue;
    }

    if(normalize(w) === 'mas'){
      const nh3 = toks[i+1] ? lookupEs(toks[i+1]) : null;
      const a3 = nh3 && nh3.find(h=>h.type==='adj');
      if(a3){
        out.push({t: a3.d.pw.replace(/g$/,'gg') + 'a'});
        applied.push('CMP "más X" → X + sufijo comparativo -a');
        i += 2;
        if(normalize(toks[i]||'') === 'que'){ out.push({t:'dan'}); i++; }
        if(['el','la'].includes(normalize(toks[i]||'')) &&
           ['mio','mío','tuyo','suyo'].includes(normalize(toks[i+1]||''))){
          const m = {mio:'fi mi', tuyo:'fi yu', suyo:'fi im'}[normalize(toks[i+1])] || 'fi mi';
          out.push({t:m}); i += 2;
        }
        continue;
      }
    }

    const adj = hit && hit.find(h=>h.type==='adj');
    if(adj){
      const ultNoun = [...out].reverse().find(o=>o.nom);
      const predicativo = out.some(o=>o.copOmitida);
      if(ultNoun && !predicativo){
        out.splice(out.indexOf(ultNoun), 0, {t: adj.d.pw});
        applied.push('SN adjetivo pospuesto → antepuesto en criollo');
      } else out.push({t: adj.d.pw});
      i++; continue;
    }

    const fn = hit && hit.find(h=>h.type==='func');
    if(fn){ out.push({t: fn.d.pw, prep: fn.d.t === 'prep'}); i++; continue; }

    /* Imperativo con enclítico: «llévame», «déjame», «dime». El español
       suelda el pronombre al verbo y el criollo lo mantiene suelto detrás,
       así que hay que separarlos antes de rendirse. Va después del léxico
       —sólo entra si la palabra entera no estaba— y antes de la derivación,
       que si no inventaría un cognado a partir de la forma soldada. */
    const enc = !hit ? separarEnclitico(w) : null;
    if(enc){
      out.push({t: enc.verbo.d.pw, verbForm:true});
      /* sin `objPron`: esa marca la usa `moveClitics` para anteponer el
         clítico al estilo español, y en criollo el objeto va detrás */
      if(enc.objeto) out.push({t: enc.objeto});
      applied.push('ENCL "' + w + '" → verbo + pronombre suelto');
      i++; continue;
    }

    /* último recurso: cascada de derivación */
    const der = (typeof resolverDesconocida === 'function') ? resolverDesconocida(w) : null;
    if(der && der.tipo === 'morfologia'){
      const v2 = der.hit.find(h=>h.type==='verb');
      const n2 = der.hit.find(h=>h.type==='noun');
      const a2 = der.hit.find(h=>h.type==='adj');
      const d2 = v2 || n2 || a2;
      if(d2){
        out.push({t: d2.d.pw, nom: !!n2, inferido:'morfologia', origen:w});
        applied.push('DER "' + w + '" reducida a "' + der.lema + '"');
        i++; continue;
      }
    }
    if(der && (der.tipo === 'cognado' || der.tipo === 'derivada')){
      out.push({t: der.pw, nom:true, inferido:der.tipo, origen:w,
                ingles:der.ingles, conf:der.conf});
      applied.push('DER "' + w + '" inferida' +
        (der.ingles ? ' del inglés "' + der.ingles + '"' : ' por cognado'));
      i++; continue;
    }

    unknown.push(w);
    out.push({t: w, unk:true});
    i++;
  }

  /* el `deh` existencial va al final de la cláusula, detrás del sintagma
     al que se refiere, pero delante del signo de cierre */
  const iDeh = out.findIndex(o => o.posponerDeh);
  if(iDeh >= 0){
    out.splice(iDeh, 1);
    let fin = out.length;
    while(fin > 0 && out[fin-1].punct) fin--;
    out.splice(fin, 0, {t:'deh'});
  }

  return finish(out, unknown, applied, toks.length, {dirPw:true});
}

/* ---------- ensamblado y cobertura ---------- */
function moveClitics(out){
  for(let i=0;i<out.length;i++){
    if(out[i].objPron){
      let j=i-1;
      while(j>=0 && !out[j].verbForm) j--;
      if(j>=0){ const c=out.splice(i,1)[0]; out.splice(j,0,c); }
    }
  }
  return out;
}

const SUJ_PRO = new Set(['yo','tu','el','ella','ello','nosotros','nosotras','vosotros','vosotras','ellos','ellas'].map(normalize));

/* El español omite el pronombre sujeto salvo foco o contraste.
   Mantenerlo produce el registro de traductor automático antiguo. */
function proDrop(out, opts){
  if(opts && opts.foco) return out;
  /* también tras "que" complementante o relativo */
  for(let k = 1; k < out.length; k++){
    if((out[k-1].comp || out[k-1].rel || out[k-1].wh) && !out[k].det && !out[k].noun &&
       SUJ_PRO.has(normalize(out[k].t))){
      out.splice(k,1); k--;
    }
  }
  for(let k = out.length-1; k >= 0; k--)
    if(normalize(out[k].t) === 'ello' && !out[k].det) out.splice(k,1);
  const i = out.findIndex(o=>!o.punct);
  if(i < 0) return out;
  if(out[i].det || out[i].noun || out[i].prep) return out;
  if(!SUJ_PRO.has(normalize(out[i].t))) return out;
  /* la 3ª persona se conserva si no hay sustantivo que la identifique */
  const amb = ['él','ella','ellos','ellas'].includes(String(out[i].t).toLowerCase());
  if(normalize(out[i].t) === 'ello'){ out.splice(i,1); return out; }
  if(amb && !out.some(o=>o.noun)) {
    const v = out.find(o=>o.verbForm);
    if(!v) return out;
  }
  out.splice(i,1);
  return out;
}

/* ---------- R5: la negación es un rasgo de la cláusula ----------
   El criollo marca la negación en todos los elementos negables.
   El español la marca una vez, y la suprime si el sujeto ya es
   negativo (nadie, nada, nunca).                                */
const NEG_INHERENTE = new Set(['nadie','nada','nunca','ninguno','ninguna','jamás']);

function colapsarNegacion(out){
  const negs = [];
  out.forEach((o,i)=>{ if(o.neg) negs.push(i); });
  if(!negs.length) return out;

  /* si algún elemento español ya es inherentemente negativo y va
     delante del verbo, el "no" preverbal sobra */
  const idxVerbo = out.findIndex(o=>o.verbForm);
  const inherenteAntes = out.some((o,i)=>
    NEG_INHERENTE.has(normalize(o.t)) && (idxVerbo < 0 || i < idxVerbo));

  if(inherenteAntes){
    for(let k = negs.length-1; k >= 0; k--) out.splice(negs[k],1);
    return out;
  }
  /* si no, se conserva sólo el primero */
  for(let k = negs.length-1; k >= 1; k--) out.splice(negs[k],1);
  return out;
}

const WH_ES = ['dónde','qué','quién','cuándo','cómo','por qué','cuál','cuánto','cuántos','adónde'];

function marcarInterrogativa(s){
  const ws = s.trim().split(/\s+/);
  const w1 = (ws[0]||'').toLowerCase();
  const w2 = (w1 + ' ' + (ws[1]||'')).toLowerCase();
  /* La polar no tiene marca en criollo: sólo la entonación, que en texto
     se escribe con el signo final. Si el original lo trae, la traducción
     es una pregunta y el español exige además el de apertura. */
  const polar = s.trim().endsWith('?');
  if(!polar && !WH_ES.includes(w1) && !WH_ES.includes(w2)) return s;
  let t = s.trim();
  if(!t.endsWith('?')) t += '?';
  if(!t.startsWith('¿')) t = '¿' + t;
  return t;
}

function finish(out, unknown, applied, total, opts){
  out = moveClitics(out);
  if(!(opts && opts.dirPw)) { out = colapsarNegacion(out); out = proDrop(out, opts); }
  if(out.length > 1 && out.some(o=>o.dem) &&
     ['ahi','alli','esta','ahí','allí'].includes(normalize(out[out.length-1].t))){
    out.pop();
  }
  let s = out.filter(o=>!o.oculto && o.t !== '').map(o=>o.t).join(' ')
    .replace(/\bde el\b/g,'del').replace(/\ba el\b/g,'al')
    .replace(/\s+([.,!?;:])/g,'$1')
    .replace(/([¿¡])\s+/g,'$1')
    .replace(/\s{2,}/g,' ')
    .trim();
  if(!(opts && opts.dirPw)) s = marcarInterrogativa(s);
  else if(s.includes('¿')){
    /* el criollo escribe la pregunta como el inglés: sólo signo final */
    s = s.replace(/¿\s*/g, '');
    if(!s.endsWith('?')) s += '?';
  }
  s = s.charAt(0).toUpperCase() + s.slice(1);
  s = s.replace(/^¿./, m=>m.toUpperCase());
  const known = total - unknown.length;
  return {
    text: s,
    coverage: total ? known/total : 0,
    unknown,
    applied,
    tokens: out
  };
}

function ruleTranslate(text){
  return dir === 'es2pw' ? esToPw(text) : pwToEs(text);
}

/* busca la frase hecha más larga que empiece en la posición i */
function matchPhrase(toks, i, map){
  for(let n = Math.min(5, toks.length - i); n >= 2; n--){
    const slice = toks.slice(i, i+n);
    if(slice.some(t=>/^[.,!?¿¡;:]$/.test(t))) continue;
    const cand = slice.join(' ');
    const hit = map.get(normalize(cand));
    if(hit) return {hit, len:n};
  }
  return null;
}

/* ============================================================
   CONJUGADOR v2 — irregularidad por patrón, no por lista
   El español tiene ~40 verbos verdaderamente irregulares y
   cientos que siguen patrones predecibles. Codificar los
   patrones cubre mucho más que enumerar formas.
   ============================================================ */

/* diptongación e→ie */
const STEM_EI = new Set(['pensar','cerrar','empezar','entender','perder','defender',
 'encender','atender','despertar','sentar','calentar','negar','regar','apretar',
 'comenzar','confesar','helar','nevar','quebrar','temblar','tropezar','querer',
 'sentir','mentir','preferir','sugerir','herir','divertir','convertir','hervir',
 'advertir','consentir','invertir']);

/* diptongación o→ue */
const STEM_OU = new Set(['contar','mostrar','recordar','encontrar','costar','volar',
 'soñar','probar','aprobar','rogar','colgar','almorzar','forzar','acordar','volver',
 'devolver','mover','morder','doler','llover','oler','resolver','soler','torcer',
 'poder','dormir','morir','jugar']);

/* debilitación e→i */
const STEM_EI2 = new Set(['pedir','repetir','servir','medir','vestir','seguir',
 'conseguir','corregir','elegir','reír','sonreír','freír','despedir','impedir',
 'competir','gemir','teñir','rendir']);

const ZC = new Set(['conocer','parecer','ofrecer','agradecer','obedecer','crecer',
 'merecer','pertenecer','establecer','aparecer','desaparecer','nacer','padecer',
 'permanecer','reconocer','favorecer','conducir','producir','traducir','reducir',
 'introducir']);

const DUCIR_PRET = new Set(['conducir','producir','traducir','reducir','introducir']);

function stemChange(stem, kind){
  /* cambia la ÚLTIMA vocal tónica del radical */
  if(kind === 'ei'){
    const i = stem.lastIndexOf('e');
    return i < 0 ? stem : stem.slice(0,i) + 'ie' + stem.slice(i+1);
  }
  if(kind === 'ou'){
    const i = stem.lastIndexOf('o');
    if(i >= 0) return stem.slice(0,i) + 'ue' + stem.slice(i+1);
    const u = stem.lastIndexOf('u');   /* jugar → juego */
    return u < 0 ? stem : stem.slice(0,u) + 'ue' + stem.slice(u+1);
  }
  if(kind === 'ei2'){
    const i = stem.lastIndexOf('e');
    return i < 0 ? stem : stem.slice(0,i) + 'i' + stem.slice(i+1);
  }
  return stem;
}

/* ajustes ortográficos para conservar el sonido */
function orth(stem, ending){
  if(/^[eéií]/.test(ending)){
    if(stem.endsWith('c'))  return stem.slice(0,-1) + 'qu';
    if(stem.endsWith('g'))  return stem + 'u';
    if(stem.endsWith('z'))  return stem.slice(0,-1) + 'c';
    if(stem.endsWith('gu')) return stem.slice(0,-1) + 'ü';
  }
  return stem;
}

const conjugateBase = conjugate;

conjugate = function(lemma, person, tense){
  const refl = lemma.endsWith('se');
  const base = refl ? lemma.slice(0,-2) : lemma;

  /* los irregulares puros mandan */
  if(IRREG[base] && IRREG[base][tense]) return conjugateBase(lemma, person, tense);

  const grp = base.slice(-2);
  if(!END[grp]) return conjugateBase(lemma, person, tense);

  let stem = base.slice(0,-2);
  const set = END[grp];
  let ending = (set[tense] || set.pres)[person];
  const tonica = [0,1,2,5].includes(person);

  if(tense === 'pres'){
    if(STEM_EI.has(base)  && tonica) stem = stemChange(stem,'ei');
    else if(STEM_OU.has(base) && tonica) stem = stemChange(stem,'ou');
    else if(STEM_EI2.has(base) && tonica) stem = stemChange(stem,'ei2');
    if(ZC.has(base) && person === 0) return stem.replace(/c$/,'') + 'zco';
    /* -ger/-gir: g→j ante o  (elegir → elijo) */
    if(person === 0 && /g$/.test(stem) && /ir$|er$/.test(grp)) stem = stem.slice(0,-1) + 'j';
    if(base.endsWith('uir') && !/(gu|qu)ir$/.test(base) && tonica) stem = stem + 'y';
  }

  if(tense === 'pret'){
    if(DUCIR_PRET.has(base)){
      const j = base.replace(/ducir$/,'duj');
      return j + ['e','iste','o','imos','isteis','eron'][person];
    }
    /* -ir con cambio vocálico: sólo 3ª persona */
    if(grp === 'ir' && (STEM_EI.has(base) || STEM_EI2.has(base)) && [2,5].includes(person))
      stem = stemChange(stem,'ei2');
    if(grp === 'ir' && STEM_OU.has(base) && [2,5].includes(person)){
      const i = stem.lastIndexOf('o');
      if(i >= 0) stem = stem.slice(0,i) + 'u' + stem.slice(i+1);
    }
    if(base.endsWith('uir') && !/(gu|qu)ir$/.test(base) && [2,5].includes(person))
      ending = person === 2 ? 'yó' : 'yeron';
    /* raíz acabada en vocal: -ió → -yó (leer, creer, oír) */
    if(/[aeo]$/.test(stem) && [2,5].includes(person))
      ending = person === 2 ? 'yó' : 'yeron';
    if(person === 0) stem = orth(stem, ending);
  }

  return (refl ? ['me','te','se','nos','os','se'][person] + ' ' : '') + stem + ending;
};

const gerundBase = gerund;
gerund = function(lemma){
  const base = lemma.endsWith('se') ? lemma.slice(0,-2) : lemma;
  if(IRREG[base] && IRREG[base].ger) return IRREG[base].ger;
  const grp = base.slice(-2);
  let stem = base.slice(0,-2);
  if(grp === 'ir' && (STEM_EI.has(base) || STEM_EI2.has(base))) stem = stemChange(stem,'ei2');
  if(grp === 'ir' && STEM_OU.has(base)){
    const i = stem.lastIndexOf('o');
    if(i >= 0) stem = stem.slice(0,i) + 'u' + stem.slice(i+1);
  }
  if((base.endsWith('uir') && !/(gu|qu)ir$/.test(base)) || /[aeo]$/.test(stem)) return stem + 'yendo';
  return stem + (grp === 'ar' ? 'ando' : 'iendo');
};

/* ============================================================
   LÉXICO v0.4 — volumen
   Se añade con deduplicación por lema español: si dos entradas
   patois comparten traducción, sólo la primera entra al índice
   inverso, para no producir elecciones aleatorias en ES→PW.
   ============================================================ */

function addAll(target, rows){
  const vistos = new Set(target.map(x=>x.es));
  const claves = new Set(target.map(x=>normalize(x.pw)));
  let n = 0;
  rows.forEach(r=>{
    if(vistos.has(r.es) || claves.has(normalize(r.pw))) return;
    vistos.add(r.es); claves.add(normalize(r.pw));
    target.push(r); n++;
  });
  return n;
}

/* --- fórmulas fijas ---
   La cortesía era el peor dominio del estudio (90,0% de cobertura) y es

  {pw:'yeah man',     es:'claro que sí'},

/* ---------- enclíticos del español ----------
   El orden importa: las combinaciones largas van primero, porque
   «dámelo» termina en «lo» y quedarse ahí daría «dáme» + «lo». */
const ENCLITICOS = [
  ['melo','mi it'], ['mela','mi it'], ['telo','yu it'], ['tela','yu it'],
  ['selo','im it'], ['sela','im it'], ['noslo','wi it'], ['nosla','wi it'],
  ['nos','wi'],  ['los','dem'], ['las','dem'], ['les','dem'],
  ['me','mi'],   ['te','yu'],   ['se',''],
  ['lo','it'],   ['la','it'],   ['le','im']
];

function separarEnclitico(tok){
  const n = String(tok).toLowerCase();
  for(const [cl, obj] of ENCLITICOS){
    if(!n.endsWith(cl)) continue;
    const raiz = n.slice(0, -cl.length);
    if(raiz.length < 2) continue;
    const h = lookupEs(raiz);
    const v = h && h.find(x => x.type === 'verb');
    if(v){
      /* «gimme» ya lleva el objeto dentro (give + me): añadirle otro
         «mi» daría «gimme mi it» */
      let objeto = obj;
      if(v.d.pw === 'gimme' && objeto.startsWith('mi')) objeto = objeto.slice(2).trim();
      return {verbo:v, clitico:cl, objeto};
    }
  }
  return null;
}

FRASES_08.forEach(p=>{
  if(!PHRASE_ES.has(normalize(p.es))){
    PHRASES.push(p);
    if(!PHRASE_PW.has(normalize(p.pw))) PHRASE_PW.set(normalize(p.pw), p);
    PHRASE_ES.set(normalize(p.es), p);
  }
});
