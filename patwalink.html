/* ============================================================
   DERIVACIÓN — reducir el "no encontrado" al mínimo

   Cascada de cuatro recursos ante una palabra desconocida:
     1. reducción morfológica  (plurales, formas verbales, sufijos)
     2. cognado latino         (español culto ↔ inglés culto)
     3. adaptación fonológica  (inglés → criollo)
     4. rendición honesta      (se declara desconocida)

   Todo lo derivado se marca como inferido. Nunca se presenta con
   la misma confianza que una entrada verificada.
   ============================================================ */

/* ---------- 1. REDUCCIÓN MORFOLÓGICA ----------
   Antes de derivar nada, se intenta llegar al lema: la mayoría de
   los "no encontrados" son formas flexionadas de palabras que sí
   están en el diccionario.                                        */

const TERM_VERBALES = [
  /áis$/,/éis$/,/ábamos$/,/íamos$/,/aremos$/,/eremos$/,/iremos$/,
  /aríamos$/,/eríamos$/,/iríamos$/,/asteis$/,/isteis$/,/aríais$/,
  /aremos$/,/aban$/,/ían$/,/aron$/,/ieron$/,/aste$/,/iste$/,
  /ando$/,/iendo$/,/ado$/,/ido$/,/aba$/,/ía$/,/aré$/,/eré$/,/iré$/,
  /aría$/,/ería$/,/iría$/,/amos$/,/emos$/,/imos$/,/áramos$/,/iéramos$/,
  /ara$/,/iera$/,/ase$/,/iese$/,/an$/,/en$/,/as$/,/es$/,/ó$/,/é$/,
  /a$/,/e$/,/o$/
];

function candidatosLema(w){
  const c = new Set();
  const n = w.toLowerCase();
  c.add(n);

  /* plural nominal */
  if(/ces$/.test(n))       c.add(n.replace(/ces$/,'z'));
  if(/[aeiouáéíóú]s$/.test(n)) c.add(n.slice(0,-1));
  if(/es$/.test(n))        c.add(n.slice(0,-2));
  if(/ones$/.test(n))      c.add(n.replace(/ones$/,'ón'));

  /* adverbio en -mente */
  if(/mente$/.test(n)){
    const base = n.replace(/mente$/,'');
    c.add(base);
    c.add(base.replace(/a$/,'o'));
  }

  /* apreciativos */
  [[/it[oa]s?$/,''],[/ill[oa]s?$/,''],[/ci[oa]s?$/,''],
   [/az[oa]s?$/,''],[/[oó]n$/,''],[/ot[oa]s?$/,'']].forEach(([re,rep])=>{
    if(re.test(n)){
      const b = n.replace(re,rep);
      if(b.length > 2){
        const v = /it[ao]s?$|ill[ao]s?$/.test(n) ? n.match(/([ao])s?$/) : null;
        if(v) c.add(b + v[1]);
        c.add(b); c.add(b+'a'); c.add(b+'o'); c.add(b+'e');
      }
    }
  });

  /* formas verbales → infinitivo probable */
  TERM_VERBALES.forEach(re=>{
    if(re.test(n)){
      const raiz = n.replace(re,'');
      if(raiz.length > 1) ['ar','er','ir'].forEach(t=> c.add(raiz+t));
    }
  });

  /* deshacer diptongación:  quiero → querer, cuento → contar */
  ['ie','ue'].forEach(dip=>{
    if(n.includes(dip)){
      const plano = n.replace(dip, dip === 'ie' ? 'e' : 'o');
      c.add(plano);
      TERM_VERBALES.forEach(re=>{
        if(re.test(plano)){
          const raiz = plano.replace(re,'');
          if(raiz.length > 1) ['ar','er','ir'].forEach(t=> c.add(raiz+t));
        }
      });
    }
  });

  c.delete(n);
  return [...c].filter(x=>x.length > 2);
}

function porMorfologia(w){
  for(const cand of candidatosLema(w)){
    const h = lookupEs(cand);
    if(h && h.length) return {hit:h, lema:cand, via:'morfología'};
  }
  return null;
}

/* ---------- 2. COGNADOS LATINOS ----------
   El español culto y el inglés culto comparten étimo latino con
   correspondencias de sufijo muy regulares. Es la vía que cubre
   casi toda la banda abstracta.                                   */

/* Correspondencias grafémicas de origen griego, previas al sufijo */
const GRAFEMAS = [
  [/^hip/,'hyp'],[/^hidr/,'hydr'],[/^hiper/,'hyper'],[/^hemo/,'hemo'],
  [/^fis/,'phys'],[/^fil/,'phil'],[/sof/,'soph'],[/^fil?os/,'philos'],[/^fon/,'phon'],[/^fot/,'phot'],
  [/^far/,'phar'],[/^fas/,'phas'],[/^teo/,'theo'],[/^tea/,'thea'],
  [/^term/,'therm'],[/^cron/,'chron'],[/^cris/,'chris'],[/^quim/,'chem'],
  [/^siqu/,'psych'],[/^psic/,'psych'],[/^rit/,'rhyth'],[/^ret/,'rhet'],
  [/^inm/,'imm'],[/^ins/,'ins'],[/^esp/,'sp'],[/^est/,'st'],[/^esc/,'sc'],
  [/^esf/,'sph'],[/^esq/,'sq'],[/^ex/,'ex'],[/cc/,'ct'],[/ñ/,'ni'],
  [/gia$/,'gy'],[/fia$/,'phy']
];

/* Sufijos latinos: el par español↔inglés es prácticamente sistemático.
   Sin tildes, porque la comparación se hace sobre la forma normalizada. */
const SUFIJOS = [
  [/cion$/,   'tion'],   [/sion$/,   'sion'],
  [/edad$/,   'ity'],    [/idad$/,   'ity'],
  [/dad$/,    'ty'],     [/tad$/,    'ty'],
  [/ia$/,     'y'],      [/eza$/,    'ness'],
  [/oso$/,    'ous'],    [/osa$/,    'ous'],
  [/ivo$/,    'ive'],    [/iva$/,    'ive'],
  [/ario$/,   'ary'],    [/aria$/,   'ary'],
  [/orio$/,   'ory'],    [/mento$/,  'ment'],
  [/miento$/, 'ment'],   [/ancia$/,  'ance'],
  [/encia$/,  'ence'],   [/ante$/,   'ant'],
  [/ente$/,   'ent'],    [/ismo$/,   'ism'],
  [/ista$/,   'ist'],    [/ura$/,    'ure'],
  [/tura$/,   'ture'],   [/ico$/,    'ic'],     [/ica$/,    'ic'],
  [/al$/,     'al'],     [/ble$/,    'ble'],
  [/ar$/,     'ate'],    [/izar$/,   'ize'],
  [/ificar$/, 'ify'],    [/ario$/,   'ary'],
  [/logia$/,  'logy'],   [/grafia$/, 'graphy'],
  [/oide$/,   'oid'],    [/itud$/,   'itude']
];

function cognadoIngles(w){
  const n = w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  /* forma con grafemas griegos y latinos corregidos */
  let g = n;
  GRAFEMAS.forEach(([re, rep])=>{ g = g.replace(re, rep); });

  /* sufijos largos primero: -encia debe ganar a -ia */
  const ordenados = [...SUFIJOS].sort((a,b)=> b[0].source.length - a[0].source.length);

  const salidas = [];
  const añadir = (forma, prio, regla)=>{
    if(forma && forma.length > 2 && !salidas.some(x=>x.forma === forma))
      salidas.push({forma, prio, regla});
  };

  /* la corrección grafémica puede haber completado ya la palabra */
  const arrastraSufijo = SUFIJOS.some(([re])=>re.test(g));
  if(g !== n && !arrastraSufijo && /(y|ph|th|ch|sc|sp|st)/.test(g)) añadir(g, 0, true);

  [[g,1],[n,2]].forEach(([base, prio])=>{
    for(const [re, ing] of ordenados){
      if(re.test(base)){
        const cand = base.replace(re, ing);
        if(cand !== base) añadir(cand, prio, true);
        break;                       /* un solo sufijo por base */
      }
    }
  });

  /* préstamo directo, sólo si ya existe en el léxico patois */
  [g, n].forEach(base=>{
    if(lookupPw(base)) añadir(base, 3, false);
    const corto = base.replace(/[oae]$/,'');
    if(corto !== base && lookupPw(corto)) añadir(corto, 3, false);
  });

  return salidas.sort((a,b)=> a.prio - b.prio);
}

/* ---------- 3. ADAPTACIÓN FONOLÓGICA INGLÉS → CRIOLLO ----------
   Reglas regulares y bien documentadas del criollo jamaicano.     */

function adaptarACriollo(ing){
  let s = ing.toLowerCase();

  /* th → d (sonora) o t (sorda) */
  s = s.replace(/^th/, 'd');
  s = s.replace(/th/g, 't');

  /* -er / -or / -ure finales → -a */
  s = s.replace(/(er|or|our|ure)$/, 'a');

  /* -tion / -sion → -shan */
  s = s.replace(/(t|s)ion$/, 'shan');

  /* reducción de grupo consonántico final */
  s = s.replace(/([bcdfgklmnprstvwz])(t|d)$/, '$1');
  s = s.replace(/nd$/, 'n').replace(/st$/, 's').replace(/ct$/, 'k');

  /* -le final → -l */
  s = s.replace(/le$/, 'l');

  /* v → b en posición inicial es variable; se deja */
  return s;
}

/* ---------- SUGERENCIAS ----------
   Si nada resuelve la palabra, al menos ofrecer las entradas más
   parecidas: cubre erratas y palabras próximas del mismo campo. */
function sugerencias(w, max){
  const n = normalize(w);
  const out = [];
  for(const [clave, entradas] of ES_INDEX){
    if(Math.abs(clave.length - n.length) > 2) continue;
    if(clave[0] !== n[0]) continue;          /* una errata rara vez cambia la inicial */
    const sim = similarity(clave, n);
    if(sim >= .74){
      /* al sugerir, el nominal es más informativo que la forma verbal
         homógrafa: "casa" es antes sustantivo que tercera persona de casar */
      const e = entradas.find(x=>x.type==='noun') ||
                entradas.find(x=>x.type==='adj')  ||
                entradas.find(x=>x.type==='verb' && x.tense==='inf') ||
                entradas[0];
      const pw = e && e.d && e.d.pw;
      if(pw && normalize(pw) !== clave) out.push({es:clave, pw, sim});
    }
  }
  const vistos = new Set();
  return out.sort((a,b)=>b.sim-a.sim)
            .filter(x=>{ if(vistos.has(x.pw)) return false; vistos.add(x.pw); return true; })
            .slice(0, max || 3);
}

/* ---------- 4. CASCADA ---------- */

/* Marca de confianza para lo inferido. Nunca llega a 1. */
const CONF = { morfologia: 0.85, cognado: 0.60, derivada: 0.40 };

function resolverDesconocida(w){
  /* 1. ¿es una forma flexionada de algo que ya tenemos? */
  const morf = porMorfologia(w);
  if(morf) return {tipo:'morfologia', hit:morf.hit, lema:morf.lema, conf:CONF.morfologia};

  let cands = cognadoIngles(w);

  /* 1b. Si ninguna regla de sufijo dispara y la palabra es un plural, se
     reintenta sobre el singular. `circunstancias` no casa con `-ancia`
     porque termina en -s, pero `circunstancia` sí; sin esto, el plural de
     cualquier palabra derivable se queda sin derivar. Se devuelve la forma
     singular a propósito: el criollo no marca el plural con -s sino con
     `dem`, que ya coloca el sintagma nominal. */
  if(!cands.some(c => c.regla) && /s$/i.test(w)){
    const singulares = /es$/i.test(w) ? [w.slice(0, -2), w.slice(0, -1)] : [w.slice(0, -1)];
    for(const sg of singulares){
      const extra = cognadoIngles(sg);
      if(extra.some(c => c.regla)){ cands = extra; break; }
    }
  }

  /* 2. ¿el cognado existe ya en el léxico patois? */
  for(const c of cands){
    const enPw = lookupPw(c.forma);
    if(enPw && enPw.length)
      return {tipo:'cognado', pw:c.forma, conf:CONF.cognado,
              nota:'Derivada del cognado inglés "' + c.forma + '", que sí está en el diccionario.'};
  }

  /* 3. derivación por sufijo latino reconocido.
        Sin regla que dispare NO se inventa nada: devolver la palabra
        española disfrazada sería peor que admitir el desconocimiento. */
  const conRegla = cands.find(c=>c.regla);
  if(conRegla){
    return {tipo:'derivada', pw: adaptarACriollo(conRegla.forma), ingles: conRegla.forma,
            conf: CONF.derivada,
            nota:'Inferida del inglés "' + conRegla.forma + '" por correspondencia latina. No verificada: en criollo podría decirse de otra forma, o no existir.'};
  }

  /* 4. rendición honesta */
  return null;
}

/* ============================================================
   DETECCIÓN DE IDIOMA
   No hace falta un clasificador entrenado: basta con puntuar el
   texto contra los dos índices que ya existen y añadir unas pocas
   señales de alto valor que sólo aparecen en una de las lenguas.
   ============================================================ */

/* Marcadores gramaticales del criollo. Son cerrados, frecuentes y
   no existen en español, así que valen mucho por aparición. */
const SENAL_PW = new Set(['mi','yu','im','wi','unu','dem','di','de','deh','a','fi',
  'nuh','nah','neva','did','done','wah','weh','dat','dis','seh','mek','haffi','cyaan',
  'gwaan','pon','inna','wid','fram','bwoy','gyal','yaad','pickney','bredren','likkle',
  'nyam','irie','criss','ting','tink','dun','zeen','bout','outa','tek','guh','wan']);

/* Palabras funcionales del español, igual de decisivas. */
const SENAL_ES = new Set(['el','la','los','las','un','una','unos','unas','de','del',
  'que','en','y','o','pero','con','sin','por','para','su','sus','mi','tu','se','lo',
  'le','les','al','es','son','está','están','ser','estar','hay','muy','más','menos',
  'cuando','donde','como','porque','si','no','ya','todo','todos','esta','este','ese',
  'yo','tú','él','ella','nosotros','ellos','me','te','nos']);

/* Rasgos ortográficos que resuelven por sí solos. */
const RE_ACENTO   = /[áéíóúüñ]/i;
const RE_SIGNO    = /[¿¡]/;
const RE_ES_TERM  = /\b\w+(ción|dad|mente|ando|iendo|aron|ieron|amos|emos|imos)\b/i;
const RE_PW_TERM  = /\b(\w*(aan|ung|eh|aa)|dem|nuh|fi|deh)\b/i;

function detectarIdioma(texto){
  const bruto = String(texto || '').trim();
  if(!bruto) return {idioma:null, conf:0, motivo:'texto vacío'};

  const toks = bruto.toLowerCase()
    .replace(/[.,!?¿¡;:"()]/g,' ')
    .split(/\s+/).filter(Boolean);
  if(!toks.length) return {idioma:null, conf:0, motivo:'sin palabras'};

  let es = 0, pw = 0;
  const razones = [];

  /* 1. señales ortográficas — muy fiables */
  if(RE_ACENTO.test(bruto)){ es += 3.5; razones.push('tildes o eñe'); }
  if(RE_SIGNO.test(bruto)){  es += 2.5; razones.push('signos de apertura'); }

  /* 2. palabras funcionales de cada lengua.
        Las que coinciden en ambas (mi, a, no, de) no puntúan. */
  const AMBIGUAS = new Set(['mi','a','no','de','me','la','di','se']);
  toks.forEach(t=>{
    const n = normalize(t);
    if(AMBIGUAS.has(n)) return;
    if(SENAL_PW.has(n)) pw += 2.2;
    if(SENAL_ES.has(n)) es += 2.0;
  });

  /* 3. presencia en cada diccionario */
  toks.forEach(t=>{
    const n = normalize(t);
    if(AMBIGUAS.has(n)) return;
    const enEs = !!lookupEs(t);
    const enPw = !!(PW_INDEX.has(n));
    /* estar sólo en un diccionario es una señal fuerte */
    if(enEs && !enPw) es += 1.6;
    if(enPw && !enEs) pw += 1.6;
  });

  /* 4. morfología típica */
  if(RE_ES_TERM.test(bruto)){ es += 1.5; razones.push('terminaciones españolas'); }
  if(RE_PW_TERM.test(bruto)){ pw += 1.5; }

  /* 5. frases hechas del criollo: señal fortísima */
  if(typeof PHRASE_PW !== 'undefined'){
    for(let i = 0; i < toks.length; i++){
      for(let n = Math.min(4, toks.length - i); n >= 2; n--){
        if(PHRASE_PW.has(normalize(toks.slice(i, i+n).join(' ')))){
          pw += 3.5; razones.push('expresión hecha del criollo');
          i += n - 1; break;
        }
      }
    }
  }

  const total = es + pw;
  if(total === 0) return {idioma:null, conf:0, motivo:'sin señales reconocibles'};

  const idioma = es >= pw ? 'es' : 'pw';
  const conf = Math.abs(es - pw) / total;

  return {
    idioma, conf,
    es: Math.round(es*10)/10,
    pw: Math.round(pw*10)/10,
    /* si todas las señales apuntan al mismo lado, basta con pocas:
       equivocarse de dirección es peor que fiarse de una coincidencia clara */
    fiable: conf >= 0.35 && total >= 1.5,
    motivo: razones.length ? razones.join(', ') : 'vocabulario'
  };
}

/* ============================================================
   1. CORPUS PARALELO ANCLA
   Ejemplos few-shot. Cada uno enseña un rasgo gramatical concreto.
   Ampliar esto es la vía más barata de subir la calidad.
   ============================================================ */
const CORPUS = [
  {es:'No sé dónde está.',            pw:'Mi nuh know weh im deh.',         teaches:'negación con nuh, "deh" locativo'},
  {es:'Voy a comer.',                 pw:'Mi a go nyam.',                    teaches:'"a go" futuro/intención'},
  {es:'Los niños están jugando fuera.',pw:'Di pickney dem a play outside.',  teaches:'plural con "dem", "a" progresivo'},
  {es:'Este es mi libro.',            pw:'A fi mi book dis.',                teaches:'foco con "a", posesivo con "fi"'},
  {es:'No tengo dinero.',             pw:'Mi nuh have nuh money.',           teaches:'concordancia negativa doble'},
  {es:'Está lloviendo fuerte.',       pw:'Rain a fall hard.',                teaches:'sin sujeto expletivo, sin cópula'},
  {es:'Estoy cansado.',               pw:'Mi tiad.',                         teaches:'cópula cero ante adjetivo'},
  {es:'Ese hombre es peligroso.',     pw:'Dat man deh dangerous.',           teaches:'demostrativo pospuesto "deh"'},
  {es:'¿Puedes ayudarme?',            pw:'Yu can help mi?',                  teaches:'interrogativa sin inversión'},
  {es:'Ella es mi hermana.',          pw:'She a mi sista.',                  teaches:'"a" ecuativo ante sustantivo'},
  {es:'Se lo dije ayer.',             pw:'Mi did tell im yesterday.',        teaches:'pasado con "did", pronombre invariable "im"'},
  {es:'Es muy bueno.',                pw:'It good bad.',                     teaches:'intensificador pospuesto'},
  {es:'Vamos a la playa.',            pw:'Wi a go a beach.',                 teaches:'"a" preposición de lugar'},
  {es:'No me gusta eso.',             pw:'Mi nuh like dat.',                 teaches:'th → d'}
];

function pickCorpus(text, n){
  const k = normalize(text);
  return CORPUS
    .map(c=>({c, s: Math.max(similarity(normalize(c.es), k), similarity(normalize(c.pw), k))}))
    .sort((a,b)=>b.s-a.s)
    .slice(0, n)
    .map(x=>x.c);
}

/* ============================================================
   2. LINTER MORFOSINTÁCTICO
   Reglas duras del criollo jamaicano. Si la salida las incumple,
   probablemente es inglés estándar con la ortografía retocada.
   Determinista: no consume tokens y no se equivoca por temperatura.
   ============================================================ */
const LINT_RULES = [
  { code:'TH',      re:/\b\w*th\w*\b/i,
    skip:/\b(thanks?|bath)\b/i,
    msg:'Dígrafo "th" presente. En criollo pasa a d o t (them→dem, thing→ting).' },
  { code:'COPULA',  re:/\b(is|are|am|was|were)\b/i,
    msg:'Cópula inglesa explícita. Ante adjetivo se omite; ante sustantivo se usa "a"; en lugar, "deh".' },
  { code:'ART',     re:/\bthe\b/i,
    msg:'Artículo "the". En criollo es "di" (o "de").' },
  { code:'PRON',    re:/\b(my|your|his|her|their|our|he|she|they|them|him|us|we|i)\b/,
    skip:/\b(mi|yu|im|dem|wi|unu)\b/i,
    msg:'Pronombre inglés. El criollo usa formas invariables: mi, yu, im, wi, unu, dem.' },
  { code:'PLURAL',  re:/\b\w{3,}s\b(?!\s*(deh|dem))/i,
    soft:true,
    msg:'Posible plural con -s. El criollo suele marcarlo con "dem" pospuesto.' },
  { code:'PAST',    re:/\b\w{3,}ed\b/i,
    msg:'Pasado con -ed. En criollo va sin marcar o con "did" antepuesto.' },
  { code:'PROG',    re:/\b\w{3,}ing\b/i,
    needsBefore:/\b(a|deh)\s+$/i,
    msg:'Gerundio sin marcador. El progresivo se forma con "a" antepuesto (mi a run).' },
  { code:'NEG',     re:/\b(don't|doesn't|didn't|not|isn't|can't)\b/i,
    msg:'Negación inglesa. En criollo: "nuh", "no", "cyaan", "neva".' },
  { code:'POSS',    re:/\w+'s\b/,
    msg:'Genitivo sajón. El criollo usa yuxtaposición o "fi" (fi mi book).' },
  { code:'VERY',    re:/\bvery\b/i,
    msg:'"very" no es criollo. Usa "well", "too", "bad" pospuesto o duplicación.' }
];

function lintPatois(text){
  if(!text) return [];
  const found = [];
  LINT_RULES.forEach(r=>{
    if(r.skip && r.skip.test(text)) return;
    const m = text.match(r.re);
    if(!m) return;
    if(r.needsBefore){
      const idx = text.toLowerCase().indexOf(m[0].toLowerCase());
      if(r.needsBefore.test(text.slice(0, idx))) return;
    }
    found.push({code:r.code, hit:m[0], msg:r.msg, soft:!!r.soft});
  });
  return found;
}

/* ============================================================
   3. SEGMENTACIÓN
   ============================================================ */
function segment(text){
  return text
    .split(/(?<=[.!?¡¿…])\s+|\n+/)
    .map(s=>s.trim())
    .filter(Boolean);
}

/* ============================================================
   4. LLAMADAS AL MODELO
   ============================================================ */
async function ask(prompt){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      messages:[{role:"user", content: prompt}]
    })
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const raw = data.content.map(b=>b.type==='text'?b.text:'').join('').trim();
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}

const GRAMMAR_BRIEF = `Rasgos obligatorios del criollo jamaicano:
- Pronombres invariables sin distinción de caso: mi, yu, im (m. y f.), wi, unu (2ª pl.), dem.
- Cópula cero ante adjetivo (mi tiad). "a" ante sustantivo (im a teacha). "deh" para lugar (mi deh yah).
- Progresivo con "a" antepuesto: mi a run. Pasado con "did" o sin marcar. Futuro con "a go" o "wi".
- Plural con "dem" pospuesto: di bwoy dem. Sin -s.
- Concordancia negativa: mi nuh have nuh money.
- Posesión por yuxtaposición o "fi": fi mi yaad.
- th → d (them→dem) o t (thing→ting). Caída de h inicial variable.
- Foco por anteposición con "a": a run mi a run.
- Intensificación pospuesta: good bad, hot too bad. Nunca "very".`;

function renderRule(x, k, det){
  const r = x.r;
  const pct = Math.round(r.coverage * 100);
  const salidaEsPatois = dir === 'es2pw';

  const infer = (r.tokens||[]).filter(t=>t.inferido);
  const cuerpo = salidaEsPatois
      ? palabrasTocables(r.text, infer)
      : r.tokens.map(t=> t.unk ? `<span class="unk">${esc(t.t)}</span>` : esc(t.t))
          .join(' ').replace(/\s+([.,!?;:])/g,'$1');

  const origen = !salidaEsPatois ? palabrasTocables(x.seg) : esc(x.seg);

  const etiqueta = det && det.idioma
    ? `<span class="detectado${det.fiable ? '' : ' duda'}">
         ${det.fiable ? 'detectado' : 'no seguro'}: ${det.idioma === 'pw' ? 'Patwa' : 'Español'}
       </span>`
    : '';

  return `
  <article class="seg">
    ${etiqueta}
    <p class="seg-src">${origen}</p>
    <div class="seg-out"><p class="rmain">${cuerpo}</p></div>

    ${infer.length ? `<div class="alerta" style="border-left-color:var(--land);background:rgba(229,174,60,.07)">
      <span><b style="color:var(--land)">Inferido:</b> ${infer.map(t=>esc(t.t)).join(', ')}. Derivado por reglas, no verificado. Un hablante podría decirlo de otra forma.</span>
    </div>` : ''}
    ${r.unknown.length ? `<div class="alerta">
      <span><b>Sin traducir:</b> ${r.unknown.map(esc).join(', ')}. No está en el diccionario y no hay forma fiable de derivarla, así que se deja tal cual en vez de inventarla.
      ${r.unknown.map(u=>{
        const sg = (typeof sugerencias === 'function') ? sugerencias(u, 3) : [];
        if(sg.length)
          return `<br><span style="color:var(--muted)">¿Quisiste decir?</span> ${sg.map(x=>
            `<span class="sug" data-sug="${esc(x.es)}">${esc(x.es)} → <b>${esc(x.pw)}</b></span>`).join(' ')}`;
        return `<br><span style="color:var(--muted)">Muchas palabras abstractas del español
          no tienen una sola palabra equivalente en criollo: se dirían con un rodeo.</span>`;
      }).join('')}</span>
    </div>` : ''}

    <div class="seg-foot">
      <button class="act" data-copiar="${esc(r.text)}"><svg class="ic" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V4a2 2 0 0 1 2-2h10"/></svg>Copiar</button>
      <span class="spacer"></span>
      <button class="act" data-diag="${k}">Análisis</button>
    </div>

    <div class="diag" id="diag${k}">
      <div class="diag-t">Reglas gramaticales aplicadas</div>
      ${r.applied.length
        ? r.applied.map(a=>{
            const m = a.match(/^([A-Z0-9]+)\s+(.*)$/);
            return `<div class="diag-r"><span class="c">${esc(m?m[1]:'·')}</span><span>${esc(m?m[2]:a)}</span></div>`;
          }).join('')
        : '<div class="diag-r"><span></span><span>Traducción directa, sin transformaciones.</span></div>'}
      <div class="diag-m">
        <div class="bar"><i style="width:${pct}%"></i></div>
        <span>${pct}% del texto en el diccionario</span>
      </div>
    </div>
  </article>`;
}

/* Explicación de los elementos gramaticales. Tocar "did" o "a"
   debe explicar el marcador, no decir "no encontrado". */
const GRAMATICA = {
  a:    {t:'marcador gramatical', q:'Tres funciones según lo que siga',
         n:'Ante verbo es progresivo (mi a nyam = estoy comiendo). Ante sustantivo es cópula (im a teacha = es profesor). Al principio de la frase marca foco (a mi dweet = fui yo quien lo hizo). Y "a go" forma el futuro.'},
  did:  {t:'marcador de anterioridad', q:'Sitúa la acción antes del pasado',
         n:'Equivale al pluscuamperfecto. Se apila con otros marcadores: "did a" es pasado progresivo, "did done" es pasado completivo.'},
  deh:  {t:'cópula locativa', q:'Estar, sólo para lugar',
         n:'Se usa cuando se indica dónde está algo (mi deh yah = estoy aquí). Para atributos se omite la cópula y para identidad se usa "a".'},
  done: {t:'marcador completivo', q:'La acción ya está terminada',
         n:'Equivale a "ya he…". No indica pasado remoto sino resultado alcanzado.'},
  dem:  {t:'plural / pronombre', q:'Marca el plural o significa "ellos"',
         n:'Pospuesto a un sustantivo lo pluraliza (di bwoy dem = los chicos). Solo, es el pronombre de tercera persona del plural.'},
  fi:   {t:'partícula polivalente', q:'Posesión, finalidad o infinitivo',
         n:'"fi mi" es "mío". Ante verbo introduce el infinitivo (mi waan fi go). Con sujeto delante equivale a "que + subjuntivo".'},
  nuh:  {t:'negador', q:'No',
         n:'El criollo admite concordancia negativa: "mi nuh have nuh money" lleva dos negadores y significa simplemente "no tengo dinero".'},
  neva: {t:'negador de pasado', q:'No (en pasado)',
         n:'Aunque viene de "never", no significa "nunca": niega una acción pasada concreta.'},
  nah:  {t:'negador prospectivo', q:'No voy a…',
         n:'Niega el progresivo o el futuro, no el pasado.'},
  wi:   {t:'futuro / pronombre', q:'Marca futuro, o significa "nosotros"',
         n:'Tras un sujeto es marcador de futuro. En posición de sujeto es el pronombre de primera persona del plural.'},
  seh:  {t:'complementante', q:'Que',
         n:'Tras verbos de decir o saber introduce la subordinada (mi know seh… = sé que…). También es el verbo "decir".'},
  weh:  {t:'interrogativo / relativo', q:'Dónde, o "que" relativo',

  mek:  {t:'causativo', q:'Dejar o hacer que',

  unu:  {t:'pronombre', q:'Vosotros',
         n:'Segunda persona del plural. El inglés estándar no distingue "you" singular de plural; el criollo sí, y conserva esta forma de origen igbo.'},
  im:   {t:'pronombre', q:'Él o ella',
         n:'No marca género. El contexto decide si se traduce por él o por ella.'},
  wuda: {t:'condicional', q:'Haría',
         n:'Forma el condicional. Su pareja "cuda" expresa capacidad: podría.'},
  cuda: {t:'condicional de capacidad', q:'Podría', n:'Condicional del verbo poder.'},

  cyaan:{t:'modal negativo', q:'No poder', n:'Contracción de "cannot". No confundir con "can", que sí es afirmativo.'},

/* Envuelve el texto en unidades consultables. Las expresiones de
   varias palabras (wah gwaan, likkle more) se agrupan en un solo
   elemento: tocar cualquiera de sus palabras abre la ficha entera. */
function palabrasTocables(texto, inferidas){
  const piezas = String(texto).split(/(\s+)/);
  const idx = [];
  piezas.forEach((tk,k)=>{ if(tk.trim()) idx.push(k); });

  const marcado = new Array(piezas.length).fill(null);
  let i = 0;
  while(i < idx.length){
    let hecho = false;
    for(let n = Math.min(4, idx.length - i); n >= 1 && !hecho; n--){
      const trozos = [];
      for(let k = 0; k < n; k++) trozos.push(piezas[idx[i+k]].replace(/[.,!?¿¡;:"]/g,''));
      const cand = trozos.join(' ').trim();
      if(!cand) continue;
      const key = normalize(cand);
      const enGlos = GLOSSARY.some(e=>
        e.normKey === key || (e.variantKeys||[]).some(v=>v.key === key));
      const enFrase = typeof PHRASE_PW !== 'undefined' && PHRASE_PW.has(key);
      const suelta = n === 1 && (lookupPw(cand) || GRAMATICA[key]);
      if(enGlos || enFrase || suelta){
        for(let k = 0; k < n; k++) marcado[idx[i+k]] = {cand, primero:k===0, ultimo:k===n-1};
        i += n; hecho = true;
      }
    }
    if(!hecho){ i++; }
  }

  return piezas.map((tk,k)=>{
    if(!tk.trim()) return tk;
    const limpio2 = tk.replace(/[.,!?¿¡;:"]/g,'');
    const inf = (inferidas||[]).find(t=>normalize(t.t) === normalize(limpio2));
    const m = marcado[k];
    if(inf){
      return `<span class="w infer" data-w="${esc(limpio2)}" data-inf="${esc(inf.origen||'')}" data-ing="${esc(inf.ingles||'')}">${esc(tk)}</span>`;
    }
    if(!m) return `<span class="w nolex">${esc(tk)}</span>`;
    const cls = 'w' + (m.primero ? ' ini' : '') + (m.ultimo ? ' fin' : '');
    return `<span class="${cls}" data-w="${esc(m.cand)}">${esc(tk)}</span>`;
  }).join('');
}

function abrirHoja(palabra){
  const n = normalize(palabra);
  const hit = lookupPw(palabra) || [];
  let gl  = hit.find(h=>h.type==='gloss');
  if(!gl){
    const e = GLOSSARY.find(x=>x.normKey === n || (x.variantKeys||[]).some(v=>v.key === n));
    if(e) gl = {d:e};
  }
  const gr  = GRAMATICA[n];
  const fr  = (typeof PHRASE_PW !== 'undefined') ? PHRASE_PW.get(n) : null;

  let html = '';

  /* 1. entrada completa del glosario, si existe */
  if(gl){
    const e = gl.d;
    html += `<div class="sh-head">
      <h2 class="sh-word">${esc(e.headword)}</h2>
      <span class="sh-pos">${esc(e.pos)}</span>
    </div>
    <p class="sh-etym">← ${esc(e.etymology)}</p>
    <div class="variants">
      <span class="vlabel">${e.variants.length} grafías registradas</span>
      ${e.variants.map(v=>`<span class="chip${normalize(v)===n?' hit':''}">${esc(v)}</span>`).join('')}
    </div>
    ${e.senses.map((s,i)=>`
      <div class="sense">
        <div class="senseno">${i+1}</div>
        <p class="gloss">${esc(s.es)}</p>
        <p class="gloss-en">${esc(s.en)}</p>
        <span class="reg" data-r="${esc(s.register)}">${esc(s.register)}</span>
        ${s.note ? `<p class="note"><span class="k">contexto</span>${esc(s.note)}</p>` : ''}
        ${s.warn ? `<div class="warn"><span class="k">cuidado</span>${esc(s.warn)}</div>` : ''}
        ${s.tone ? `<div class="tone"><span class="k">entonación</span>${esc(s.tone)}</div>` : ''}
        ${s.ex ? `<div class="ex"><span class="p">${esc(s.ex.p)}</span><span class="t">${esc(s.ex.t)}</span></div>` : ''}
      </div>`).join('')}`;
  }

  /* 2. elemento gramatical */
  else if(gr){
    html += `<div class="sh-head">
      <h2 class="sh-word">${esc(palabra)}</h2>
      <span class="sh-tag gram">gramática</span>
    </div>
    <p class="sh-etym">${esc(gr.t)}</p>
    <p class="sh-quick">${esc(gr.q)}</p>
    <p class="note" style="margin-top:10px"><span class="k">cómo funciona</span>${esc(gr.n)}</p>`;
  }

  /* 3. expresión hecha */
  else if(fr){
    html += `<div class="sh-head">
      <h2 class="sh-word">${esc(fr.pw)}</h2>
      <span class="sh-tag">expresión</span>
    </div>
    <p class="sh-quick">${esc(fr.es)}</p>
    <p class="note" style="margin-top:14px"><span class="k">nota</span>Se traduce como bloque: sus palabras por separado no dan este significado.</p>`;
  }

  /* 4. entrada de diccionario simple */
  else {
    const v = hit.find(h=>h.type==='verb');
    const s2 = hit.find(h=>h.type==='noun');
    const a2 = hit.find(h=>h.type==='adj');
    const p2 = hit.find(h=>h.type==='pron');
    const f2 = hit.find(h=>h.type==='func');
    const d  = v || s2 || a2 || p2 || f2;

    if(!d){
      html += `<div class="sh-head"><h2 class="sh-word">${esc(palabra)}</h2></div>
        <p class="sh-none">Esta palabra no está en el léxico. El motor la deja sin traducir en vez de inventar un equivalente.</p>`;
    } else {
      const cat = v ? 'verbo' : s2 ? 'sustantivo' : a2 ? 'adjetivo' : p2 ? 'pronombre' : 'partícula';
      const trad = v ? v.d.es : s2 ? s2.d.es : a2 ? a2.d.es : p2 ? p2.d.suj : f2.d.es[0];
      html += `<div class="sh-head">
        <h2 class="sh-word">${esc(palabra)}</h2>
        <span class="sh-pos">${cat}</span>
      </div>
      <p class="sh-quick">${esc(trad)}</p>`;

      if(v){
        html += `<p class="note" style="margin-top:14px"><span class="k">clase aspectual</span>${
          esEstativo(v.d.es)
            ? 'Estativo. Sin marcador delante se entiende en presente.'
            : 'Dinámico. Sin marcador delante se entiende en pasado; para el presente hace falta "a".'}</p>`;
      }
      if(s2){
        html += `<p class="note" style="margin-top:14px"><span class="k">plural</span>Se pluraliza posponiendo "dem": ${esc(palabra)} dem.</p>`;
      }
    }
  }

  /* las claves de normalización sólo interesan si la palabra falló */
  if(!gl && !gr && !fr && !hit.length){
    html += `<div class="keys" style="margin-top:16px">
      <div><span class="lbl">clave normal</span><span class="val">${esc(normalize(palabra))}</span></div>
      <div><span class="lbl">clave fonética</span><span class="val">${esc(phoneticKey(palabra))}</span></div>
    </div>`;
  }

  sheetBody.innerHTML = html;
  sheet.classList.add('on');
  sheetBg.classList.add('on');
}

document.addEventListener('click', e=>{
  const el = e.target.closest('.w');
  if(!el || el.classList.contains('nolex')) return;
  if(el.classList.contains('infer')) abrirHojaInferida(el);
  else abrirHoja(el.dataset.w);
});

function abrirHojaInferida(el){
  const pw  = el.dataset.w;
  const org = el.dataset.inf;
  const ing = el.dataset.ing;
  sheetBody.innerHTML = `
    <div class="sh-head">
      <h2 class="sh-word">${esc(pw)}</h2>
      <span class="sh-tag" style="background:var(--land);color:var(--abyss);border-color:var(--land)">inferido</span>
    </div>
    <p class="sh-etym">${esc(org)}${ing ? ' → ing. "' + esc(ing) + '"' : ''} → ${esc(pw)}</p>
    <p class="sh-quick">No está en el diccionario</p>
    <p class="note" style="margin-top:14px"><span class="k">cómo se ha formado</span>
      Esta forma no procede del diccionario verificado. Se ha derivado aplicando las
      correspondencias regulares entre el español culto y el inglés, y después las
      reglas fonológicas del criollo.</p>
    <div class="warn"><span class="k">cuidado</span>
      Nadie ha comprobado que se diga así. El criollo jamaicano no tiene registro culto
      escrito, de modo que muchas palabras abstractas del español simplemente no tienen
      equivalente: se expresarían con un rodeo.</div>`;
  sheet.classList.add('on');
  sheetBg.classList.add('on');
}


paintDir();
</script>
</body>
</html>
