plugins { id 'com.android.application' }

/*
 * PatwaLink — envoltorio Android.
 *
 * La aplicación entera vive en `patwalink.html`, en la raíz del
 * repositorio. Este módulo sólo la aloja: un WebView sin permisos, sin
 * puente JavaScript y sin red. Todo lo que se añada aquí debe respetar
 * esa premisa.
 */

/** Versión publicada. `versionCode` lo puede fijar CI: -PversionCode=42 */
def versionPublica = '1.1'
def codigoVersion  = (project.findProperty('versionCode') ?: '1') as Integer

/*
 * Firma de release. El keystore nunca se versiona: llega por propiedad
 * de Gradle (local) o por variable de entorno (CI). Si no hay ninguno,
 * `release` cae a la clave de depuración y el APK queda instalable a
 * mano pero no publicable, que es el comportamiento seguro.
 */
def rutaKeystore = project.findProperty('keystoreFile') ?: System.getenv('KEYSTORE_FILE')
def hayFirmaPropia = rutaKeystore && file(rutaKeystore).exists()

android {
    namespace 'com.patwalink.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.patwalink.app'
        minSdk 24
        targetSdk 34
        versionCode codigoVersion
        versionName versionPublica

        /* Sin código nativo ni recursos por idioma: nada que filtrar. */
        resourceConfigurations += ['es']
    }

    signingConfigs {
        if (hayFirmaPropia) {
            propia {
                storeFile     file(rutaKeystore)
                storePassword project.findProperty('keystorePassword') ?: System.getenv('KEYSTORE_PASS')
                keyAlias      project.findProperty('keyAlias')         ?: System.getenv('KEY_ALIAS')
                keyPassword   project.findProperty('keyPassword')      ?: System.getenv('KEY_PASS')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig hayFirmaPropia ? signingConfigs.propia : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
        viewBinding false
    }

    /* El APK no necesita el manifiesto de dependencias que AGP inserta
       para Play: la app no se distribuye por ahí y es un blob opaco. */
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/*.version', '/kotlin/**']
        }
    }

    lint {
        /* Los errores paran la compilación; los avisos no. Convertir avisos
           en errores exige una línea base generada con el SDK delante, y sin
           ella el primer aviso nuevo rompe CI por algo que no es un defecto. */
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds true
        ignoreTestSources true
        textReport true
    }
}

dependencies {
    /* AndroidX arrastra kotlin-stdlib 1.8.22 por un lado y los viejos
       kotlin-stdlib-jdk7/jdk8 1.6.21 por otro, y sus clases chocan en
       `checkDebugDuplicateClasses`. El BOM alinea las tres a la misma
       versión: a partir de 1.8 los jdk7/jdk8 son cascarones vacíos. */
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

/*
 * Una sola fuente de verdad para la app web: el HTML de la raíz se copia
 * a assets antes de compilar. Así el APK nunca empaqueta una copia
 * divergente, ni en local ni en CI, y por eso `assets/index.html` está
 * en .gitignore.
 */
def fuenteWeb = rootProject.file('patwalink.html')

def sincronizarWeb = tasks.register('sincronizarWeb', Copy) {
    description = 'Copia patwalink.html a assets como index.html'
    group = 'build'

    /* Falla pronto y con un mensaje claro: sin esto el APK compila y se
       instala, pero abre una pantalla en blanco. */
    doFirst {
        if (!fuenteWeb.exists()) {
            throw new GradleException(
                "No se encuentra ${fuenteWeb}.\n" +
                '  La app web es obligatoria: sin ella el APK arranca vacío.')
        }
    }

    from(fuenteWeb) { rename { 'index.html' } }
    into layout.projectDirectory.dir('src/main/assets')
}

tasks.named('preBuild') { dependsOn sincronizarWeb }
