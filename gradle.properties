# Memoria del demonio de Gradle. 2 GB basta para un módulo con una sola
# Activity; subirlo no acelera nada y estorba en runners compartidos.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Sólo se compila lo que ha cambiado, y en paralelo cuando se puede.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# El proyecto no usa Kotlin ni Compose: desactivar lo que no se usa
# recorta la configuración de cada compilación.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false
